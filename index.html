<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فيش بوك تجريبي</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#DFF2F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فيش بوك">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{
  /* layout: one phone-width column, calm header, roomy cards on a pale sea-grey ground, bottom tab bar */
  --ground:#F1F8FA; --card:#FFFFFF; --line:#E1EDF1; --ink:#0E2A44; --muted:#4A6072;
  --brand:#0E2A44; --soft:#E1F0F3; --accent:#0B7C88; --teal:#22B8C4;
  --good:#10314F; --ok:#7FD6DD; --mid:#FFE2A8; --bad:#F6C9BF;
  --shadow:0 6px 22px rgba(14,60,90,.08),0 1px 2px rgba(14,60,90,.04);
  --font:'Cairo','Segoe UI',Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #2F7FB5;outline-offset:2px}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--ground)}
header{background:var(--brand);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{margin:0;font-size:22px;font-weight:800;line-height:1.2;display:flex;align-items:center;gap:10px}
/* اسم التطبيق: "فيش" أبيض و"بوك" بأزرق البحر، وتحتهم موجة */
.wm{position:relative;display:inline-block;padding-bottom:6px;font-size:24px;line-height:1.15}
.wm2{color:#7FD3EE}
.wv{position:absolute;left:0;right:0;bottom:0;width:100%;height:6px}
header .logo{flex:0 0 36px;border-radius:9px;box-shadow:0 0 0 1.5px rgba(255,255,255,.25)}
header span{font-size:13px;color:#D5E6F2;font-weight:600}
main{flex:1;overflow-y:auto;padding:0 0 24px}
nav{background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px 8px}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;background:none;border:0;color:var(--muted);font-size:12px;font-weight:600}
nav button[aria-current="page"]{color:var(--brand);font-weight:800}
.strip{display:flex;gap:8px;overflow-x:auto;padding:16px 20px 4px}
.day{flex:0 0 58px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.day b{font-size:20px;font-weight:800;line-height:1}
.day .wd{font-size:12px;font-weight:600;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.day[aria-pressed="true"] .wd{color:#D5E6F2}
.pill{display:inline-block;font-size:13px;font-weight:800;border-radius:8px;padding:0 8px;font-variant-numeric:tabular-nums}
.s-good{background:var(--good);color:#fff}.s-ok{background:var(--ok);color:#0A3F36}.s-mid{background:var(--mid);color:#5A3A00}.s-bad{background:var(--bad);color:#6B1D0E}
.card{margin:16px 20px 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(11,42,63,.05)}
.sum{display:flex;gap:16px;align-items:center}
.big{flex:0 0 76px;height:76px;border-radius:38px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big b{font-size:30px;font-weight:800;line-height:1}.big span{font-size:12px;font-weight:600}
h2{font-size:17px;font-weight:800;margin:0;text-wrap:balance}
.sec{margin:24px 20px 0;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted);font-size:13px}
.tbl{padding:6px 0}
.row{display:grid;grid-template-columns:48px 1fr 60px 56px;align-items:center;gap:10px;padding:7px 18px}
.row.h{font-size:12px;font-weight:700;color:var(--muted);padding-bottom:4px}
.row>span{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.wind{display:flex;align-items:center;gap:6px;border-radius:10px;padding:7px 10px;font-size:15px!important;font-weight:800!important}
.wind small{font-size:12px;font-weight:600}
.temp{border-radius:10px;padding:7px 0;text-align:center;font-size:15px!important;font-weight:800!important}
.trip{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(11,42,63,.05)}
.trip .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.trip strong{font-size:16px;font-weight:800}
.trip .bot{display:flex;justify-content:space-between;align-items:center;gap:12px}
.price{font-size:16px;font-weight:800}
.chip{display:inline-block;font-size:12px;font-weight:700;background:var(--soft);border-radius:8px;padding:2px 10px}
.btn{flex:0 0 auto;min-height:46px;padding:0 20px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-weight:800}
.btn[disabled]{background:#D3DBE1;color:#44566A;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--ink)}
.q{display:block;width:100%;text-align:right;min-height:52px;padding:12px 18px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-weight:700}
.ans{display:flex;flex-direction:column;gap:10px}
.ans p{margin:0}
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
input,select{min-height:46px;border:1px solid #9FB0BC;border-radius:12px;padding:0 12px;background:#fff;font-size:16px;width:100%}
.filter{display:flex;align-items:center;gap:10px}
.filter label{flex-direction:row;align-items:center;gap:10px;flex:1;white-space:nowrap}
.err{color:#8C1D0A;font-size:13px;font-weight:700;min-height:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);border-radius:14px;padding:4px}
.seg button{min-height:44px;border:0;border-radius:11px;background:none;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 1px 2px rgba(11,42,63,.12)}
.ovl{position:fixed;inset:0;background:rgba(11,42,63,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.ovl[hidden]{display:none}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:22px 22px 0 0;padding:22px 20px 26px;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
.rowbtns{display:flex;gap:8px}.rowbtns .btn{flex:1}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.list .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chart{padding:16px 12px 14px}
.chart h2,.chart .muted{padding:0 6px}
.bars{display:flex;gap:2px;align-items:flex-end;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.bar{flex:0 0 36px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 6px;border:0;border-radius:10px;background:none}
.bar[aria-pressed="true"]{background:var(--soft)}
.bar .bt{height:128px;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;border-bottom:1px solid #9FB0BC}
.bar .best{font-size:10px;font-weight:800;line-height:1.1}
.bar .bn{font-size:12px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.bar .bf{display:block;width:calc(100% - 6px);max-width:26px;border-radius:4px 4px 0 0}
.bar .wd{font-size:10px;font-weight:600;color:var(--muted);line-height:1.3}
.bar b{font-size:14px;font-weight:800;line-height:1.1}
.bar .bf.pre{background:#fff;border:2px dashed var(--ink);border-bottom:0}
.bar .mo{font-size:10px;font-weight:700;line-height:1.2;min-height:12px;white-space:nowrap}
.bar.more{flex:0 0 70px;align-self:stretch;justify-content:center;border:1.5px dashed #9FB0BC;font-size:12px;font-weight:800;margin-inline-start:6px}
.big.pre{background:#fff;border:2px dashed var(--ink)}
.legend i.pre{border:2px dashed var(--ink)}
.chart .legend{padding:10px 6px 0}
.legend i.g1{background:var(--good);border-color:var(--good)}.legend i.g2{background:var(--ok);border-color:var(--ok)}.legend i.g3{background:var(--mid);border-color:var(--mid)}.legend i.g4{background:var(--bad);border-color:var(--bad)}
.rates{display:flex;gap:6px;flex-wrap:wrap}
.rate{display:inline-flex;align-items:center;gap:5px;min-height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.rate .muted{font-weight:600}
.stars{display:flex;gap:2px}
.st{width:46px;height:46px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:10px}
.st svg{fill:#fff;stroke:#44566A}.st.on svg{fill:#B26A00;stroke:#B26A00}
.tide svg{display:block;width:100%;height:auto;margin:10px 0 4px}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.trow b{font-weight:800}
.notif{display:flex;flex-direction:column;gap:8px}
.notif .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.btn.sm{min-height:44px;padding:0 14px;font-size:13px}
.mgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:10px 0 6px}
.mc{border:1.5px solid #9FB0BC;border-radius:7px;background:#fff;text-align:center;font-size:12px;font-weight:700;padding:5px 0;font-variant-numeric:tabular-nums}
.mc.in{background:var(--ok);border-color:var(--ok);color:#0A3F36}
.mc.pk{background:var(--good);border-color:var(--good);color:#fff}
.mc.now{outline:2.5px solid var(--accent);outline-offset:1px}
.legend i.in{background:var(--ok);border-color:var(--ok)}.legend i.pk{background:var(--good);border-color:var(--good)}.legend i.nw{border:2.5px solid var(--accent)}
.shot{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:8px;display:block}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.tile b{display:block;font-size:22px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);font-weight:600}
.seats{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 6px}
.seat{width:18px;height:18px;border-radius:5px;border:1.5px solid #9FB0BC;background:#fff}
.seat.on{background:var(--brand);border-color:var(--brand)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 6px}
.cd{border-radius:10px;border:1.5px solid #9FB0BC;background:#fff;padding:5px 0;text-align:center;line-height:1.2}
.cd b{display:block;font-size:15px;font-weight:800}
.cd small{font-size:10px;font-weight:600}
.cd.trip{background:var(--mid);border-color:var(--mid);color:#5A3A00}
.cd.full{background:var(--good);border-color:var(--good);color:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1.5px solid #9FB0BC;background:#fff;vertical-align:-2px;margin-inline-end:4px}
.legend i.trip{background:var(--mid);border-color:var(--mid)}.legend i.full{background:var(--good);border-color:var(--good)}
button.cd{font-family:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:62px}
/* لون الخانة: فساد أو حمل. الخط اللي تحت: نوع الليلة. الإطار الأخضر: أفضل الأيام */
.cd.fas{background:#DDF3EC;border-color:#9CD6C6}
.cd.hml{background:#DFECF8;border-color:#A9C8E6}
button.cd{padding:5px 0 9px}
.cd.mdark{box-shadow:inset 0 -5px 0 var(--brand)}
.cd.mlit{box-shadow:inset 0 -5px 0 #E9B93A}
.cd.best{border:2.5px solid var(--good)}
.cd[aria-pressed="true"]{outline:2.5px solid var(--accent);outline-offset:1px}
.cd .pc{font-size:10px;font-weight:800;border-radius:6px;padding:0 4px;line-height:1.6;font-variant-numeric:tabular-nums}
.cd .pc.pre{background:#fff;border:1.5px dashed var(--ink);line-height:1.4}
.legend i.fas{background:#DDF3EC;border-color:#9CD6C6}.legend i.hml{background:#DFECF8;border-color:#A9C8E6}.legend i.best{border:2.5px solid var(--good)}
.legend i.mdark{background:var(--brand);border-color:var(--brand);height:5px;vertical-align:2px}.legend i.mlit{background:#E9B93A;border-color:#E9B93A;height:5px;vertical-align:2px}
.brk{margin:0 20px;background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;padding:6px 18px 12px}
.card.sum.hasbrk{border-radius:18px 18px 0 0}
.bk{display:grid;grid-template-columns:78px 1fr 64px 78px;align-items:center;gap:8px;padding:5px 0;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.bk b{font-weight:800;white-space:nowrap}.bk .muted{font-size:12px;font-weight:600}
.bkb{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;display:block}
.bkb i{display:block;height:100%;border-radius:4px}
ul.list li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}

/* ===== الشكل الجديد (اتجاه A من ماجنافيك): أرضية مائية فاتحة، كروت بيضا ناعمة من غير إطار،
   كحلي وتركواز، دايرة للنسبة، وشريط تبويبات كحلي. القواعد دي بتعدّل على اللي فوق. ===== */
body{background:#D9EBF0}
#app{background:linear-gradient(180deg,#DFF2F5 0,var(--ground) 300px)}
header{background:none;color:var(--ink);padding:14px 18px 8px;justify-content:flex-start;gap:12px}
header .logo{flex:0 0 48px;width:48px;height:48px;border-radius:14px;box-shadow:0 6px 14px rgba(14,42,68,.22)}
header h1{font-size:24px;gap:0}
header h1 span{color:var(--ink);font-size:inherit;font-weight:inherit}
header h1 .wm{font-size:25px;padding-bottom:5px}header h1 .wm2{color:#0E9AA7}
header #hArea{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.hd{display:flex;flex-direction:column;gap:1px;min-width:0}
main{scroll-behavior:smooth;padding-bottom:28px;scrollbar-width:thin;scrollbar-color:#C5DCE3 transparent}
.bars,.strip{scrollbar-width:thin;scrollbar-color:#C5DCE3 transparent;padding-bottom:6px}
.card,.trip,ul.list li,.q,.tile{border:0;box-shadow:var(--shadow)}
.card{border-radius:24px;margin:16px 16px 0;padding:20px}
.trip{border-radius:22px;padding:18px}
ul.list li{border-radius:18px}
.q{border-radius:18px;transition:transform .12s}
.q:active{transform:scale(.985)}
.sec{margin:26px 16px 0}
.strip{padding-inline:16px}
.brk{margin:0 16px;border:0;border-top:1px solid var(--line);border-radius:0 0 24px 24px;padding:8px 20px 14px;box-shadow:0 12px 22px rgba(14,60,90,.07)}
.card.sum.hasbrk{border-radius:24px 24px 0 0}
.tbl{padding:8px 0}
/* دايرة النسبة */
.big{flex:0 0 98px;width:98px;height:98px;border-radius:50%;color:var(--ink);--ring:var(--teal);
  background:radial-gradient(closest-side,#fff 79%,transparent 80%),conic-gradient(var(--ring) calc(var(--p,0)*1%),#DCEBEF 0)}
.big.s-good{--ring:#10314F}.big.s-ok{--ring:var(--teal)}.big.s-mid{--ring:#E9B93A}.big.s-bad{--ring:#E07A5F}
.big b{font-size:26px}.big span{font-size:11px;color:var(--muted)}
.big.pre{background:#fff;border:2px dashed #7F97A8}
/* الأعمدة */
.bar{border-radius:14px;transition:background .2s}
.bar[aria-pressed="true"]{background:#D9EEF2}
.bar .bt{border-bottom:0}
.bar .bf{border-radius:8px;max-width:22px;transition:height .45s cubic-bezier(.2,.8,.2,1)}
.bar .bf.pre{border:2px dashed #7F97A8;border-radius:8px}
.bar.more{border-color:#9AD3D9;color:#0B6F7A;border-radius:14px}
.pill{border-radius:999px;padding:1px 10px}
.chip{background:#E1F2F4;color:#0B5560;border-radius:999px;padding:3px 12px}
.rate{border-radius:999px;border-color:var(--line)}
/* الزراير */
.btn{border-radius:16px;background:linear-gradient(180deg,#0E8996,#0A6E79);box-shadow:0 6px 14px rgba(11,124,136,.28);transition:transform .12s,box-shadow .2s}
.btn:active{transform:scale(.97);box-shadow:0 2px 6px rgba(11,124,136,.28)}
.btn[disabled]{background:#DCE6EA;color:#5B7080;box-shadow:none}
.btn.ghost{background:#fff;color:#0B6F7A;border:1.5px solid #9AD3D9;box-shadow:none}
input,select{border:1.5px solid #CFE0E6;border-radius:14px;background:#F8FCFD;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(34,184,196,.18);outline:0}
.seg{background:#DDEDF1;border-radius:16px}
.seg button{border-radius:13px;transition:background .2s,color .2s}
/* شريط التبويبات */
nav{background:#0E2A44;border-top:0;border-radius:24px 24px 0 0;padding:6px 6px 10px;box-shadow:0 -8px 22px rgba(14,42,68,.2)}
nav button{color:#A9C4D6;border-radius:16px;transition:background .2s,color .2s}
nav button[aria-current="page"]{color:#fff;font-weight:800;background:rgba(34,184,196,.2);box-shadow:inset 0 3px 0 var(--teal)}
/* كارت إشعار الصبح: كحلي */
.card.notif{background:linear-gradient(135deg,#0E2A44,#14506C);color:#fff}
.notif .muted{color:#C9DDE8}
.notif .chip{background:rgba(255,255,255,.16);color:#fff}
.notif .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.notif .rate{background:rgba(255,255,255,.14);color:#fff;border:0}
/* النوافذ */
.ovl{backdrop-filter:blur(3px);animation:fade .2s ease both}
.sheet{border-radius:28px 28px 0 0;animation:up .28s cubic-bezier(.2,.8,.2,1) both}
/* دخول الصفحة عند تغيير التبويب بس */
#main.enter>*{animation:rise .34s ease both}
#main.enter>*:nth-child(2){animation-delay:.04s}#main.enter>*:nth-child(3){animation-delay:.08s}#main.enter>*:nth-child(n+4){animation-delay:.12s}
.rate.wa{color:#136B3A;border-color:#BFE8CF;background:#F2FBF5}
.trip.hl{box-shadow:0 0 0 3px var(--teal),var(--shadow)}
/* ===== الخريطة البحرية ===== */
nav{grid-template-columns:repeat(6,1fr)}
nav button{font-size:11.5px}
main[hidden]{display:none}
#mapWrap{flex:1;min-height:0;position:relative;z-index:0;margin:6px 12px 12px;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);background:#CFE6EE}
#mapWrap[hidden]{display:none}
#map{position:absolute;inset:0;font-family:var(--font);background:#CFE6EE}
.mtools{position:absolute;top:10px;right:10px;z-index:1000;display:flex;flex-direction:column;gap:8px}
.mbtn{width:46px;height:46px;border-radius:14px;border:0;background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(14,42,68,.25);display:flex;align-items:center;justify-content:center}
.mbtn[aria-pressed="true"]{background:var(--brand);color:#fff}
.mbar{position:absolute;left:10px;right:10px;bottom:24px;z-index:1000;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 6px 18px rgba(14,42,68,.28);display:flex;flex-direction:column;gap:8px}
.mbar .dep{font-size:14px;font-weight:600}.mbar .dep b{font-weight:800;font-size:16px}
.mbar strong{font-size:15px;font-weight:800}
.mbar .pos{direction:ltr;text-align:right;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.mbar .rowbtns .btn{min-height:44px;padding:0 12px;font-size:14px}

<script>
const WD=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const WDS=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const GM=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const HM=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
const SLOTS=['2 ص','5 ص','8 ص','11 ص','2 م','5 م','8 م','11 م'];
const FORECAST_DAYS=10;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const today=new Date();today.setHours(12,0,0,0);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fromIso=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const gDate=d=>WD[d.getDay()]+' '+d.getDate()+' '+GM[d.getMonth()];
const dWord=n=>n===1?'يوم واحد':n===2?'يومين':n<=10?n+' أيام':n+' يوم';

/* ---------- Hijri ---------- */
let hFmt=null;
try{const f=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric'});
  if(f.resolvedOptions().calendar.indexOf('islamic')===0)hFmt=f;}catch(e){}
function hijri(d){
  if(hFmt){try{const p={};hFmt.formatToParts(d).forEach(x=>p[x.type]=x.value);
    const day=parseInt(p.day,10),m=parseInt(p.month,10),y=parseInt(p.year,10);
    if(day>0&&m>0&&m<13)return{day,month:m-1,year:y};}catch(e){}}
  const anchor=new Date(2026,10,11,12);const n=Math.round((d-anchor)/864e5);const L=29.5306;
  const mi=Math.floor(n/L);const day=Math.floor(n-mi*L)+1;const tot=5+mi;
  return{day,month:((tot%12)+12)%12,year:1448+Math.floor(tot/12)};
}
const hText=d=>{const h=hijri(d);return h.day+' '+HM[h.month]+' '+h.year};
/* حمل: 12–18 و 27–4 ، فساد: 5–11 و 19–26 */
const isFasad=day=>(day>=5&&day<=11)||(day>=19&&day<=26);
const isTurn=day=>[3,4,11,12,17,18,26,27].includes(day);

/* ---------- Sample weather ---------- */
function rng(str){let h=1779033703;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}
const wxCache={};
function weather(d){
  const k=iso(d);if(wxCache[k])return wxCache[k];
  /* جو حقيقي لو متحمّل لليوم ده، وإلا أرقام تجريبية */
  const rl=realWx[k];
  if(rl&&rl.wind){const pick=a=>HRS.map(h=>a&&typeof a[h]==='number'?a[h]:null);
    const W=pick(rl.wind),T=pick(rl.temp),P=pick(rl.pres),D=pick(rl.dir),V=pick(rl.wave);
    if(![...W,...T,...P,...D].includes(null)){const wind=W.map(Math.round),rw=!V.includes(null);
      /* Open-Meteo بيدي اتجاه الرياح "جاية منين"، والسهم هنا "رايحة فين" */
      return wxCache[k]={wind,temp:T.map(Math.round),pres:P.map(Math.round),dir:D.map(x=>(Math.round(x)+180)%360),
        wave:rw?V.map(x=>Math.round(x*10)/10):wind.map(w=>Math.max(0.2,Math.round(w*0.045*10)/10)),real:true,realWave:rw}}}
  let wind,temp,pres,dir;
  if(k==='2026-11-13'){wind=[13,15,12,12,8,9,11,12];temp=[23,22,23,23,24,24,24,24];pres=[1018,1019,1020,1020,1018,1018,1019,1019];dir=[135,135,135,160,165,140,135,135];}
  else{const r=rng(k);const base=6+r()*13,tb=21+r()*4,pb=1014+r()*7,db=120+r()*50;const dt=[-1,-2,0,1,2,2,1,0];
    wind=[];temp=[];pres=[];dir=[];
    for(let i=0;i<8;i++){wind.push(Math.max(3,Math.round(base+((i<2||i>5)?1.5:-1.5)+(r()*4-2))));
      temp.push(Math.round(tb+dt[i]*0.7));pres.push(Math.round(pb+(r()*2-1)+(k.charCodeAt(9)%3===0?-i*0.6:0)));dir.push(Math.round(db+r()*20-10));}}
  const wave=wind.map(w=>Math.max(0.2,Math.round(w*0.045*10)/10));
  return wxCache[k]={wind,temp,pres,dir,wave};
}
function score(d){
  /* بعد أيام التوقعات: تقييم مبدئي من الهجري بس */
  if(!inForecast(iso(d))){const hd=hijri(d).day;return{val:isFasad(hd)?(isTurn(hd)?80:70):(isTurn(hd)?60:50),prelim:true}}
  const w=weather(d),h=hijri(d),idx=[1,2,3,4,5]; /* ساعات النهار: 5 ص لحد 5 م */
  const avg=a=>idx.reduce((s,i)=>s+a[i],0)/idx.length,r1=x=>Math.round(x*10)/10;
  /* lin: الدرجة كاملة لحد good، وبتنزل بالتدريج لصفر عند bad */
  const lin=(x,good,bad)=>Math.max(0,Math.min(1,(bad-x)/(bad-good)));
  const aw=avg(w.wind),av=avg(w.wave),at=avg(w.temp),dp=Math.abs(w.pres[7]-w.pres[0]),fas=isFasad(h.day),turn=isTurn(h.day);
  /* فرق المد والجزر الحقيقي في اليوم: كل ما يقل، التيار أضعف */
  const a0=new Date(d);a0.setHours(0,0,0,0);const t0=a0.getTime(),t1=t0+864e5;let rng=null;
  if(sea.length&&t0>=seaFrom&&t1<=seaTo){const hs=sea.filter(p=>p.t>=t0&&p.t<=t1).map(p=>p.h);rng=Math.max.apply(null,hs)-Math.min.apply(null,hs)}
  const parts=[
    {name:'الرياح',max:WEIGHTS.wind,pts:WEIGHTS.wind*lin(aw,8,22),note:Math.round(aw)+' عقدة'},
    {name:'الموج',max:WEIGHTS.wave,pts:WEIGHTS.wave*lin(av,0.4,1.5),note:r1(av).toFixed(1)+' م'},
    {name:'حمل وفساد',max:WEIGHTS.hijri,pts:Math.min(WEIGHTS.hijri,WEIGHTS.hijri*(fas?1:0.5)+(turn?WEIGHTS.hijri*0.15:0)),note:(fas?'فساد':'حمل')+(turn?' · يوم تحول':'')},
    {name:'المد والجزر',max:WEIGHTS.tide,pts:WEIGHTS.tide*(rng===null?(fas?0.8:0.5):0.4+0.6*lin(rng,0.25,0.75)),note:rng===null?'تقريبي':'فرق '+Math.round(rng*100)+' سم'},
    {name:'الضغط',max:WEIGHTS.pres,pts:WEIGHTS.pres*lin(dp,2,6),note:dp<=2?'مستقر':'اتغير '+dp+' مليبار'},
    {name:'الحرارة',max:WEIGHTS.temp,pts:WEIGHTS.temp*(at<18?lin(at,18,10):lin(at,32,40)),note:Math.round(at)+'°'}];
  let best=1;idx.forEach(i=>{if(w.wind[i]<w.wind[best])best=i});
  return{val:Math.round(parts.reduce((s,p)=>s+p.pts,0)),best,stable:dp<=2,parts,real:!!w.real};
}
/* أوزان المؤشر، مجموعها 100 */
const WEIGHTS={wind:35,wave:20,hijri:20,tide:10,pres:10,temp:5};
const sClass=v=>v>=80?'s-good':v>=70?'s-ok':v>=50?'s-mid':'s-bad';
const sWord=v=>v>=80?'يوم ممتاز للصيد':v>=70?'يوم كويس للصيد':v>=50?'يوم متوسط':'يوم ضعيف';
/* تفاصيل النسبة: كل عامل خد كام من كام */
const breakdown=s=>`<div class="brk">${s.parts.map(p=>`<div class="bk"><span>${p.name}</span><span class="bkb"><i class="${sClass(p.pts/p.max*100)}" style="width:${Math.round(p.pts/p.max*100)}%"></i></span><b>${Math.round(p.pts)} من ${p.max}</b><span class="muted">${p.note}</span></div>`).join('')}</div>`;
const windColor=w=>w<=6?'#CFE6F7':w<=9?'#BDE0F5':w<=13?'#A9E3CF':w<=16?'#F3E08A':w<=20?'#F9C07A':'#F2A08F';
const tempColor=t=>t<=18?'#BFDDF5':t<=21?'#CDEBD8':t<=23?'#FFDFA6':t<=25?'#FFD08A':t<=28?'#FFBE6B':'#F7A283';
const dirName=a=>{const n=['ش','ش.ق','ق','ج.ق','ج','ج.غ','غ','ش.غ'];return n[Math.round((((a+180)%360))/45)%8]};

/* ---------- Tides (تقريبي للنسخة التجريبية) ---------- */
const TIDE_P=12.4206*3600e3,SLACK_LAG=30*60e3;const TIDE_ANCHOR0=new Date(2026,10,13,3,0).getTime();let TIDE_ANCHOR=TIDE_ANCHOR0;
const tm=t=>{const x=new Date(t);let h=x.getHours();const m=String(x.getMinutes()).padStart(2,'0'),ap=h<12?'ص':'م';h=h%12||12;return h+':'+m+' '+ap};

/* ---------- جو ومد حقيقي من Open-Meteo (مجاني، من غير مفتاح) ---------- */
const HRS=[2,5,8,11,14,17,20,23];
/* المناطق: نقطة في البحر لكل منطقة (lat, lon). slon لو نقطة الموج والمد غير نقطة الرياح. */
const AREAS=[
  {id:'hurghada',name:'الغردقة',lat:27.26,lon:33.83,slon:33.90},
  {id:'giftun',name:'الجفتون',lat:27.20,lon:33.97},
  {id:'gouna',name:'الجونة',lat:27.40,lon:33.75},
  {id:'tawila',name:'طويلة',lat:27.58,lon:33.78},
  {id:'gubal',name:'جوبال',lat:27.67,lon:33.82},
  {id:'shadwan',name:'شدوان',lat:27.50,lon:34.00},
  {id:'safaga',name:'سفاجا',lat:26.75,lon:34.02},
  {id:'quseir',name:'القصير',lat:26.10,lon:34.33},
  {id:'marsaalam',name:'مرسى علم',lat:25.07,lon:34.95}];
let area=AREAS[0];try{const s=localStorage.getItem('fishbook-area'),f=AREAS.find(a=>a.id===s);if(f)area=f}catch(e){}
const wxUrl=a=>'https://api.open-meteo.com/v1/forecast?latitude='+a.lat+'&longitude='+a.lon+'&hourly=wind_speed_10m,wind_direction_10m,temperature_2m,pressure_msl&wind_speed_unit=kn&timezone=Africa%2FCairo&past_days=31&forecast_days=16';
const seaUrl=a=>'https://marine-api.open-meteo.com/v1/marine?latitude='+a.lat+'&longitude='+(a.slon||a.lon)+'&hourly=wave_height,sea_level_height_msl&timezone=Africa%2FCairo&past_days=1&forecast_days=16';
let realWx={},sea=[],tideEv=[],seaFrom=0,seaTo=0,seaMin=0,seaMax=0,live='loading',liveAt=0;
function applyLive(wj,mj){
  const days={},put=(j,map)=>{const h=j.hourly;h.time.forEach((s,i)=>{const o=days[s.slice(0,10)]=days[s.slice(0,10)]||{},hr=Number(s.slice(11,13));
    for(const f in map){if(h[f])(o[map[f]]=o[map[f]]||[])[hr]=h[f][i]}})};
  put(wj,{wind_speed_10m:'wind',wind_direction_10m:'dir',temperature_2m:'temp',pressure_msl:'pres'});
  if(mj&&mj.hourly)put(mj,{wave_height:'wave'});
  realWx=days;for(const k in wxCache)delete wxCache[k];
  /* مستوى البحر كل ساعة: منه المنحنى وأوقات أعلى مد وأقل جزر */
  const s=[];
  if(mj&&mj.hourly&&mj.hourly.sea_level_height_msl){const h=mj.hourly,off=(mj.utc_offset_seconds||0)*1000;
    h.time.forEach((x,i)=>{const v=h.sea_level_height_msl[i];if(typeof v==='number')s.push({t:Date.parse(x+':00Z')-off,h:v})})}
  let ok=s.length>6;for(let i=1;i<s.length;i++)if(s[i].t-s[i-1].t!==3600e3)ok=false;
  sea=ok?s:[];tideEv=[];TIDE_ANCHOR=TIDE_ANCHOR0;if(!ok)return;
  seaFrom=sea[1].t;seaTo=sea[sea.length-2].t;seaMin=Math.min.apply(null,sea.map(p=>p.h));seaMax=Math.max.apply(null,sea.map(p=>p.h));
  for(let i=1;i<sea.length-1;i++){const a=sea[i-1].h,b=sea[i].h,c=sea[i+1].h,hi=b>a&&b>=c,lo=b<a&&b<=c;if(!hi&&!lo)continue;
    /* قطع مكافئ على 3 نقط عشان وقت القمة يطلع بالدقيقة مش بالساعة */
    const den=a-2*b+c,dx=den?0.5*(a-c)/den:0,e={t:sea[i].t+dx*3600e3,high:hi,h:b-0.25*(a-c)*dx},p=tideEv[tideEv.length-1];
    if(p&&p.high===e.high){if(hi?e.h>p.h:e.h<p.h)tideEv[tideEv.length-1]=e}else tideEv.push(e)}
  /* الأيام اللي بعد التوقعات: المنحنى التقريبي بيتظبط على آخر مد حقيقي */
  const lastHigh=tideEv.filter(e=>e.high).pop();if(lastHigh)TIDE_ANCHOR=lastHigh.t;
}
function seaAt(t){const x=(t-sea[0].t)/3600e3,i=Math.max(1,Math.min(sea.length-3,Math.floor(x))),u=x-i,p0=sea[i-1].h,p1=sea[i].h,p2=sea[i+1].h,p3=sea[i+2].h;
  return 0.5*(2*p1+(p2-p0)*u+(2*p0-5*p1+4*p2-p3)*u*u+(3*p1-p0-3*p2+p3)*u*u*u)}
/* قمم المد وقيعان الجزر بين وقتين: حقيقية لو البيانات مغطية، وإلا تقريبية */
function tideEvents(a,b){
  if(sea.length&&a>=seaFrom&&b<=seaTo)return{real:true,ev:tideEv.filter(e=>e.t>=a&&e.t<b)};
  const ev=[];for(let k=Math.floor((a-TIDE_ANCHOR)/(TIDE_P/2))-1;;k++){const t=TIDE_ANCHOR+k*TIDE_P/2;if(t>=b)break;if(t>=a)ev.push({t,high:((k%2)+2)%2===0})}
  return{real:false,ev};
}
async function loadLive(){
  const a=area;
  try{const [wj,mj]=await Promise.all([fetch(wxUrl(a)).then(r=>{if(!r.ok)throw new Error('wx');return r.json()}),fetch(seaUrl(a)).then(r=>r.ok?r.json():null).catch(()=>null)]);
    if(!wj||!wj.hourly||!wj.hourly.time)throw new Error('wx');
    if(a!==area)return; /* المستخدم غيّر المنطقة والتحميل شغال */
    applyLive(wj,mj);live='ok';liveAt=Date.now();
    try{localStorage.setItem('fishbook-live',JSON.stringify({at:liveAt,area:a.id,wj,mj}))}catch(e){}
  }catch(e){if(a!==area)return;if(live!=='cache'&&!useSnap())live='fail'}
  /* منعيدش الرسم لو المستخدم بيكتب في فورم */
  if(view!=='log'&&view!=='manage'){const be=$('#bars');if(be)barScroll=be.scrollLeft;render()}
}
/* تغيير المنطقة: نمسح جو المنطقة القديمة ونحمّل الجديدة */
function setArea(id){const f=AREAS.find(a=>a.id===id);if(!f||f===area)return;area=f;try{localStorage.setItem('fishbook-area',f.id)}catch(e){}
  realWx={};sea=[];tideEv=[];TIDE_ANCHOR=TIDE_ANCHOR0;for(const k in wxCache)delete wxCache[k];live='loading';

/* الإشعارات (Web Push): الاشتراك بيتحفظ في push_subs، والإرسال من دالة push على السيرفر */
const pushOk=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&/^https?:$/.test(location.protocol);
async function pushFn(body){const r=await fetch(SB_URL+'/functions/v1/push',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json()}
const kick=()=>{pushFn({action:'drain'}).catch(()=>{})}; /* ابعت الإشعارات المستنية دلوقتي */
const b64u=s=>{const p=(s+'==='.slice((s.length+3)%4)).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(p),a=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);return a};
async function curSub(){const reg=await navigator.serviceWorker.ready;return reg.pushManager.getSubscription()}
async function saveSub(s){const j=s.toJSON();
  await sbFetch('/rest/v1/rpc/save_push_sub',{method:'POST',body:{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_area:area.id,p_area_name:area.name,p_lat:area.lat,p_lon:area.lon}})}
async function syncNotif(){
  const was=notifOn;
  try{if(!pushOk()||!srvOn()||!uid())notifOn=false;
    else{const s=await curSub();notifOn=!!s&&Notification.permission==='granted';if(notifOn)await saveSub(s)}}catch(e){notifOn=false}
  if(was!==notifOn)render();
}
async function dropSub(unsub){try{if(!pushOk())return;const s=await curSub();if(!s)return;
  await sbFetch('/rest/v1/rpc/drop_push_sub',{method:'POST',body:{p_endpoint:s.endpoint},noAuth:true});if(unsub)await s.unsubscribe()}catch(e){}}
async function toggleNotif(){
  notifMsg='';
  if(!srvOn()){notifOn=!notifOn;render();return}
  if(!uid()){openAuth('ادخل بحسابك عشان الإشعارات توصلك على الجهاز ده، وبعدين اضغط "فعّل الإشعار" تاني.');return}
  if(!pushOk()){notifMsg='المتصفح ده مبيدعمش الإشعارات. على آيفون: ثبّت التطبيق على الشاشة الرئيسية الأول وافتحه منها.';render();return}
  try{
    if(notifOn){await dropSub(true);notifOn=false;notifMsg='الإشعارات اتقفلت على الجهاز ده.'}
    else{
      const p=await Notification.requestPermission();
      if(p!=='granted'){notifMsg='الإشعارات مقفولة للموقع ده من إعدادات المتصفح. افتحها من الإعدادات وجرّب تاني.';render();return}
      const reg=await navigator.serviceWorker.ready,k=(await pushFn({action:'key'})).key;
      const s=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k)});
      await saveSub(s);notifOn=true;notifMsg='الإشعارات اتفعّلت على الجهاز ده.';
    }
  }catch(e){notifMsg='معرفناش نفعّل الإشعارات على الجهاز ده.'}
  render();
}

function mapLocate(){
  if(!navigator.geolocation){mapSel=null;mapNote='الجهاز ده مش بيدّي الموقع.';mapBar();return}
  mapSel=null;mapNote='بنحدد موقعك...';mapBar();
  navigator.geolocation.getCurrentPosition(p=>{
    mePos={lat:p.coords.latitude,lon:p.coords.longitude};mapNote='';
    if(map){if(meMk)meMk.remove();meMk=L.marker([mePos.lat,mePos.lon],{icon:mkIcon('medot',18),interactive:false,zIndexOffset:500}).addTo(map);
      map.setView([mePos.lat,mePos.lon],Math.max(map.getZoom(),12))}
    mapBar()},
    e=>{mapNote=e.code===1?'محتاجين إذن الموقع عشان نوريك مكانك على الخريطة. اسمح بيه من إعدادات المتصفح.':'معرفناش نحدد موقعك دلوقتي. جرّب تاني وانت في مكان مفتوح.';mapBar()},
    {enableHighAccuracy:true,timeout:15000,maximumAge:30000});
}
function openMarkSave(){
  if(!mapSel||mapSel.t!=='pin')return;
  $('#sheet').innerHTML=`<h2>احفظ نقطة صيد</h2><span class="muted" dir="ltr" style="text-align:right">${posText(mapSel.lat,mapSel.lon)}</span>
  <form id="markForm" novalidate><label for="mName">اسم النقطة<input id="mName" maxlength="30" placeholder="مثلاً: شعب الناجل" autocomplete="off"></label>
    <div class="err" id="mErr" role="alert"></div>
    <div class="rowbtns"><button class="btn" type="submit">احفظ</button><button class="btn ghost" type="button" data-act="close">إلغاء</button></div></form>
  <span class="muted">النقط بتتحفظ على الجهاز ده بس ومحدش غيرك بيشوفها.</span>`;
  $('#ovl').hidden=false;$('#mName').focus();
}
function render(){
  const isMap=view==='map';$('#main').hidden=isMap;$('#mapWrap').hidden=!isMap;
  if(isMap){$('#main').innerHTML='';document.querySelectorAll('nav button').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});showMap();return}
  $('#main').innerHTML=view==='home'?home():view==='trips'?tripsView():view==='ask'?askView():view==='log'?logView():manageView();
  document.querySelectorAll('nav button').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  if(view==='home'){const be=$('#bars');if(be){if(barScroll!==null)be.scrollLeft=barScroll;
    if(reveal){const el=be.querySelector('[aria-pressed="true"]');if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest',inline:'center'});reveal=false}}}
  /* لينك رحلة متشارك: نفضل نوصل للرحلة لحد ما الجو يخلص تحميل (الصفحة بتترسم تاني) */
  if(scrollToTrip&&view==='trips'){const el=document.querySelector('[data-trip="'+scrollToTrip+'"]'),m=$('#main');
    if(el)m.scrollTo({top:m.scrollTop+el.getBoundingClientRect().top-m.getBoundingClientRect().top-90,behavior:'instant'});
    if(live!=='loading')scrollToTrip=null}
}
let enterT=0;
function go(v){if(v!=='trips'){sharedMsg='';hlTrip=null}view=v;try{location.hash=v}catch(e){}render();const m=$('#main');m.scrollTop=0;
  m.classList.remove('enter');void m.offsetWidth;m.classList.add('enter');clearTimeout(enterT);enterT=setTimeout(()=>m.classList.remove('enter'),520)}

/* ---------- Booking sheet ---------- */
function openBook(id){
  const t=trips.find(x=>x.id===id);if(!t||t.left<1)return;
  const whole=mode==='boat';if(whole&&!wholeFree(t))return;
  if(srvOn()&&!uid()){openAuth('ادخل بحسابك أو اعمل حساب جديد عشان تحجز. بعد الدخول اضغط احجز تاني.');return}
  const n=whole?t.total:Math.min(t.left,6);let o='';for(let i=1;i<=n;i++)o+=`<option value="${i}">${i}</option>`;
  $('#sheet').innerHTML=`<h2>${whole?'حجز المركب كاملة: ':'حجز مكان في '}${esc(t.boat)}</h2><span class="muted">${tripRange(t)} · ${dWord(t.n)} · ${whole?t.full+' جنيه للمركب كاملة':t.price+' جنيه للفرد'}</span>
  <form id="bookForm" data-id="${t.id}" data-kind="${whole?'boat':'seat'}" novalidate>
    <label for="bName">الاسم<input id="bName" maxlength="40" autocomplete="name" value="${esc((srvOn()&&me&&me.name)||'')}"></label>
    <label for="bPhone">رقم الموبايل<input id="bPhone" type="tel" inputmode="tel" maxlength="15" autocomplete="tel"></label>
    <label for="bSeats">${whole?'هتطلعوا كام فرد':'عدد الأماكن'}<select id="bSeats">${o}</select></label>
    <div class="err" id="bErr" role="alert"></div>
    <div class="rowbtns"><button class="btn" type="submit">أكد الحجز</button><button class="btn ghost" type="button" data-act="close">إلغاء</button></div></form>`;
  $('#ovl').hidden=false;$('#bName').focus();
}
function closeSheet(){$('#ovl').hidden=true;$('#sheet').innerHTML='';sheetAuth=false}

document.addEventListener('click',e=>{
  const nb=e.target.closest('nav button');if(nb){go(nb.dataset.view);return}
  const a=e.target.closest('[data-act]');if(!a){if(e.target.id==='ovl')closeSheet();return}
  const act=a.dataset.act;const be=$('#bars');if(be)barScroll=be.scrollLeft;
  if(act==='day'){sel=a.dataset.d;render()}
  else if(act==='goto'){sel=a.dataset.d;ensureH(sel);reveal=true;go('home')}
  else if(act==='more'){H+=30;render()}
  else if(act==='alert'){alerts[sel]=true;render()}
  else if(act==='role'){if(srvOn()&&uid())setRole(a.dataset.r);else{role=a.dataset.r;render()}}
  else if(act==='authmode'){authMode=a.dataset.m;authMsg='';if(sheetAuth)$('#sheet').innerHTML=authCard();else render()}
  else if(act==='signout')signOut();
  else if(act==='share')shareTrip(Number(a.dataset.id));
  else if(act==='mapbase')setMapBase(mapBase==='chart'?'sat':'chart');
  else if(act==='mapsea'){mapSea=!mapSea;setMapBase(mapBase)}
  else if(act==='maploc')mapLocate();
  else if(act==='mapclear'){mapSel=null;mapNote='';mapPin(null);mapBar()}
  else if(act==='marksave')openMarkSave();
  else if(act==='markdel'){marks=marks.filter(m=>m.id!==Number(a.dataset.id));saveMarks();mapSel=null;drawMarks();mapBar()}
  else if(act==='areago'){const id=a.dataset.id;mapSel=null;if(AREAS.find(x=>x.id===id)===area)go('home');else{view='home';try{location.hash='home'}catch(e){}setArea(id)}drawMarks()}
  else if(act==='cancelbk')openCancelBk(Number(a.dataset.id));
  else if(act==='canceltrip')openCancelTrip(Number(a.dataset.id));
  else if(act==='edittrip')openEditTrip(Number(a.dataset.id));
  else if(act==='mode'){mode=a.dataset.m;render()}
  else if(act==='ask')ask(a.dataset.q);
  else if(act==='book')openBook(Number(a.dataset.id));
  else if(act==='close')closeSheet();
  else if(act==='notif')toggleNotif();
  else if(act==='reload'){live='loading';render();loadLive()}
  else if(act==='ratetrip')openTripRate(Number(a.dataset.id));
  else if(act==='nav')go(a.dataset.v);
  else if(act==='dellog'){const id=Number(a.dataset.id),drop=()=>{logs=logs.filter(e=>e.id!==id);delete shots[id];saveLogs();render()};
    if(logSrv){a.disabled=true;sbFetch('/rest/v1/catches?id=eq.'+id,{method:'DELETE'}).then(drop).catch(()=>{a.disabled=false})}else drop()}
  else if(act==='rate')openRate(a.dataset.k);
  else if(act==='star'){starSel=Number(a.dataset.n);document.querySelectorAll('.st').forEach((b,i)=>{b.classList.toggle('on',i<starSel);b.setAttribute('aria-pressed',i<starSel?'true':'false')})}
});
document.addEventListener('change',e=>{if(e.target.id==='lImg'){onPhoto(e.target.files&&e.target.files[0]);return}
  if(e.target.id==='areaSel'){const be=$('#bars');if(be)barScroll=be.scrollLeft;setArea(e.target.value);return}
  if(e.target.id==='durSel'){const be=$('#bars');if(be)barScroll=be.scrollLeft;dur=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ovl').hidden)closeSheet()});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='markForm'){
    const name=$('#mName').value.trim();
    if(!name){$('#mErr').textContent='اكتب اسم للنقطة.';return}
    if(!mapSel||mapSel.t!=='pin'){closeSheet();return}
    const m={id:Date.now(),name,lat:mapSel.lat,lon:mapSel.lon};marks.push(m);saveMarks();
    mapPin(null);mapSel={t:'mark',id:m.id};closeSheet();drawMarks();mapBar();return}
  if(e.target.id==='bookForm'){
    const t=trips.find(x=>x.id===Number(e.target.dataset.id));
    const name=$('#bName').value.trim(),phone=$('#bPhone').value.trim(),seats=Number($('#bSeats').value);
    if(name.length<2){$('#bErr').textContent='اكتب الاسم.';return}
    if(!/^\+?\d{10,14}$/.test(phone)){$('#bErr').textContent='اكتب رقم موبايل صحيح، أرقام بس.';return}
    const whole=e.target.dataset.kind==='boat';
    if(whole&&(!t||!wholeFree(t))){$('#bErr').textContent='المركب اتحجز فيها أماكن ومبقتش متاحة كاملة.';return}
    if(!t||seats<1||seats>t.left){$('#bErr').textContent='عدد الأماكن المتاحة أقل من المطلوب.';return}
    if(srvOn()){srvRun(e.target,'#bErr',async()=>{
      await sbFetch('/rest/v1/rpc/book_trip',{method:'POST',body:{p_trip:t.id,p_seats:seats,p_whole:whole,p_name:name,p_phone:phone}});
      kick();showBooked(t,whole,seats);await loadSrv()});return}
    if(whole)t.left=0;else t.left-=seats;
    bookings.push({id:Date.now(),name,phone,seats,whole,boat:t.boat,range:tripRange(t),by:t.by,org:t.org,date:t.date,n:t.n,rated:0});
    showBooked(t,whole,seats);
    render();
  }else if(e.target.id==='authForm'){
    const email=$('#aEmail').value.trim(),pw=$('#aPw').value,name=$('#aName')?$('#aName').value.trim():'';
    if(authMode==='up'&&name.length<2){$('#aErr').textContent='اكتب اسمك.';return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){$('#aErr').textContent='اكتب إيميل صحيح.';return}
    if(pw.length<6){$('#aErr').textContent='كلمة السر 6 حروف أو أرقام على الأقل.';return}
    srvRun(e.target,'#aErr',async()=>{
      await doAuth(email,pw,name);
      if(!uid()){if(sheetAuth)$('#sheet').innerHTML=authCard();else render();return}
      if(sheetAuth)closeSheet();render()});
  }else if(e.target.id==='cancelBk'){
    const id=Number(e.target.dataset.id);
    srvRun(e.target,'#cbErr',async()=>{await sbFetch('/rest/v1/rpc/cancel_booking',{method:'POST',body:{p_booking:id}});kick();closeSheet();await loadSrv()});
  }else if(e.target.id==='cancelTrip'){
    const id=Number(e.target.dataset.id);
    srvRun(e.target,'#ctErr',async()=>{await sbFetch('/rest/v1/trips?id=eq.'+id,{method:'PATCH',body:{status:'cancelled'}});kick();closeSheet();await loadSrv()});
  }else if(e.target.id==='editTrip'){
    const t=trips.find(x=>x.id===Number(e.target.dataset.id));if(!t)return;
    const bk=t.total-t.left,b=boats.find(x=>x.id===t.boatId),date=$('#eDate').value;
    const n=Number($('#eDays').value),seats=Number($('#eSeats').value),price=Number($('#ePrice').value),full=Number($('#eFull').value)||0;
    if(!(seats>=1)||seats!==Math.round(seats)){$('#eErr').textContent='اكتب عدد الأماكن رقم صحيح.';return}
    if(seats<bk){$('#eErr').textContent='مينفعش الأماكن تبقى أقل من المحجوز ('+bk+').';return}
    if(b&&seats>b.cap){$('#eErr').textContent='المركب دي تشيل '+b.cap+' فرد بس.';return}
    const body={seats_total:seats};
    if(!bk){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<iso(today)){$('#eErr').textContent='اختار تاريخ من النهارده أو بعده.';return}
      if(!(n>=1)||n!==Math.round(n)){$('#eErr').textContent='اكتب عدد الأيام رقم صحيح، يوم أو أكتر.';return}
      if(!(price>=0)||full<0){$('#eErr').textContent='اكتب السعر بالأرقام.';return}
      Object.assign(body,{start_date:date,days:n,price_seat:Math.round(price),price_whole:Math.round(full)});
    }
    srvRun(e.target,'#eErr',async()=>{await sbFetch('/rest/v1/trips?id=eq.'+t.id,{method:'PATCH',body});closeSheet();await loadSrv()});
  }else if(e.target.id==='rateForm'){
    const k=e.target.dataset.k;
    if(starSel<1){$('#rErr').textContent='اختار عدد النجوم الأول.';return}
    (ratings[k]=ratings[k]||[]).push({s:starSel,text:$('#rText').value.trim(),name:$('#rName').value.trim()});
    render();openRate(k,true);
  }else if(e.target.id==='logForm'){
    const species=($('#lSp').value||$('#lOther').value.trim()),kg=Math.round(Number($('#lKg').value)*10)/10,date=$('#lDate').value,bait=$('#lBait').value.trim();
    const time=/^\d{2}:\d{2}$/.test($('#lTime').value)?$('#lTime').value:'',spot=$('#lSpot').value.trim(),trip=$('#lTrip')?$('#lTrip').value:'';
    if(species.length<2){$('#lErr').textContent='اكتب نوع السمك.';return}
    if(!(kg>0)){$('#lErr').textContent='اكتب الوزن بالكيلو، رقم أكبر من صفر.';return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>iso(today)){$('#lErr').textContent='اختار يوم الصيد، النهارده أو قبله.';return}
    const f=$('#lImg').files&&$('#lImg').files[0];
    const add=id=>{if(f&&f.type.indexOf('image/')===0){try{shots[id]=URL.createObjectURL(f)}catch(err){}}
      logs.push({id,date,time,species,kg,bait,spot,trip});saveLogs();render()};
    if(logSrv){const bk=myBk().find(b=>b.boat+' · '+b.range===trip);
      srvRun(e.target,'#lErr',async()=>{
        const r=await sbFetch('/rest/v1/catches',{method:'POST',prefer:'return=representation',body:{caught_on:date,caught_at:time||null,species,kg,bait,spot,trip_id:bk?bk.tripId:null,area:area.id}});
        add(r[0].id)});return}
    add(Date.now());
  }else if(e.target.id==='tripRateForm'){
    const b=bookings.find(x=>x.id===Number(e.target.dataset.id));
    if(starSel<1){$('#trErr').textContent='اختار عدد النجوم الأول.';return}
    if(b&&srvOn()){const body=$('#trText').value.trim(),rows=[{booking_id:b.id,target:'boat',stars:starSel,body}];
      if(b.org)rows.push({booking_id:b.id,target:'publisher',stars:starSel,body});
      srvRun(e.target,'#trErr',async()=>{await sbFetch('/rest/v1/ratings',{method:'POST',body:rows});closeSheet();await loadSrv()});return}
    if(b){const r={s:starSel,text:$('#trText').value.trim(),name:b.name};(ratings['b:'+b.boat]=ratings['b:'+b.boat]||[]).push(r);
      if(b.org)(ratings['o:'+b.org]=ratings['o:'+b.org]||[]).push(r);b.rated=starSel}
    closeSheet();render();
  }else if(e.target.id==='addBoat'){
    const name=$('#bbName').value.trim(),cap=Number($('#bbCap').value);
    if(name.length<2){$('#bbErr').textContent='اكتب اسم المركب.';return}
    if(!(cap>=1&&cap<=60)){$('#bbErr').textContent='عدد الأفراد من 1 لـ 60.';return}
    if(srvOn()){srvRun(e.target,'#bbErr',async()=>{
      await sbFetch('/rest/v1/boats',{method:'POST',body:{name,capacity:Math.round(cap),area:area.id,owner_id:role==='owner'?uid():null}});await loadSrv()});return}
    boats.push({id:nextId++,name,cap:Math.round(cap)});render();
  }else if(e.target.id==='addTrip'){
    const b=boats.find(x=>x.id===Number($('#tBoat').value)),date=$('#tDate').value;
    const n=Number($('#tDays').value),seats=Number($('#tSeats').value),price=Number($('#tPrice').value),full=Number($('#tFull').value)||0;
    if(!b){$('#tErr').textContent='اختار المركب.';return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<iso(today)){$('#tErr').textContent='اختار تاريخ من النهارده أو بعده.';return}
    if(!(n>=1)||n!==Math.round(n)){$('#tErr').textContent='اكتب عدد الأيام رقم صحيح، يوم أو أكتر.';return}
    if(!(seats>=1)){$('#tErr').textContent='اكتب عدد الأماكن.';return}
    if(seats>b.cap){$('#tErr').textContent='المركب دي تشيل '+b.cap+' فرد بس.';return}
    if(!(price>=0)||full<0){$('#tErr').textContent='اكتب السعر بالأرقام.';return}
    const done=()=>{dur='';mode='seat';sel=date;ensureH(date);reveal=true;go('trips')};
    if(srvOn()){srvRun(e.target,'#tErr',async()=>{
      await sbFetch('/rest/v1/trips',{method:'POST',body:{boat_id:b.id,start_date:date,days:n,seats_total:Math.round(seats),price_seat:Math.round(price),price_whole:Math.round(full),area:area.id}});
      await loadSrv();done()});return}
    trips.push({id:nextId++,date,boat:b.name,n,total:Math.round(seats),left:Math.round(seats),price:Math.round(price),full:Math.round(full),by:role,org:role==='org'?(($('#tOrg')&&$('#tOrg').value.trim())||'منظم تجريبي 1'):''});
    done();
  }
});
function fromHash(){const h=(location.hash||'').slice(1);if(['home','trips','map','ask','log','manage'].includes(h)&&h!==view){view=h;render()}}
window.addEventListener('hashchange',fromHash);
const h0=(location.hash||'').slice(1);if(['home','trips','map','ask','log','manage'].includes(h0))view=h0;
/* آخر جو متحمّل (لو أحدث من 6 ساعات) يظهر فورًا، وبعدين نحدّث من النت */
try{const c=JSON.parse(localStorage.getItem('fishbook-live')||'null');if(c&&c.area===area.id&&c.wj&&c.wj.hourly&&Date.now()-c.at<6*3600e3){applyLive(c.wj,c.mj);live='cache';liveAt=c.at}}catch(e){}
if(live!=='cache')useSnap();
$('#hArea').textContent=area.name+' · نسخة تجريبية';
render();
loadLive();
loadSrv();
// التثبيت والفتح من غير نت: بيشتغل بس لما الملف يتفتح من سيرفر (http/https)، مش من file://
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
