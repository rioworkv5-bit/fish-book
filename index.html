<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فيش بوك تجريبي</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#DFF2F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فيش بوك">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{
  /* layout: one phone-width column, calm header, roomy cards on a pale sea-grey ground, bottom tab bar */
  --ground:#F1F8FA; --card:#FFFFFF; --line:#E1EDF1; --ink:#0E2A44; --muted:#4A6072;
  --brand:#0E2A44; --soft:#E1F0F3; --accent:#0B7C88; --teal:#22B8C4;
  --good:#10314F; --ok:#7FD6DD; --mid:#FFE2A8; --bad:#F6C9BF;
  --shadow:0 6px 22px rgba(14,60,90,.08),0 1px 2px rgba(14,60,90,.04);
  --font:'Cairo','Segoe UI',Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #2F7FB5;outline-offset:2px}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--ground)}
header{background:var(--brand);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{margin:0;font-size:22px;font-weight:800;line-height:1.2;display:flex;align-items:center;gap:10px}
/* اسم التطبيق: "فيش" أبيض و"بوك" بأزرق البحر، وتحتهم موجة */
.wm{position:relative;display:inline-block;padding-bottom:6px;font-size:24px;line-height:1.15}
.wm2{color:#7FD3EE}
.wv{position:absolute;left:0;right:0;bottom:0;width:100%;height:6px}
header .logo{flex:0 0 36px;border-radius:9px;box-shadow:0 0 0 1.5px rgba(255,255,255,.25)}
header span{font-size:13px;color:#D5E6F2;font-weight:600}
main{flex:1;overflow-y:auto;padding:0 0 24px}
nav{background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px 8px}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;background:none;border:0;color:var(--muted);font-size:12px;font-weight:600}
nav button[aria-current="page"]{color:var(--brand);font-weight:800}
.strip{display:flex;gap:8px;overflow-x:auto;padding:16px 20px 4px}
.day{flex:0 0 58px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.day b{font-size:20px;font-weight:800;line-height:1}
.day .wd{font-size:12px;font-weight:600;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.day[aria-pressed="true"] .wd{color:#D5E6F2}
.day{flex:0 0 62px;font-family:inherit;color:inherit;border:0;box-shadow:var(--shadow)}
.day .wd{white-space:nowrap}
.day{background:linear-gradient(to bottom,var(--wc,var(--card)),#fff 115%)}
.day .pill{font-size:11px;padding:0 7px;background:rgba(255,255,255,.8);color:var(--ink)}
.day[aria-pressed="true"]{background:linear-gradient(to bottom,var(--wc,var(--card)),#fff 115%);color:var(--ink);box-shadow:0 0 0 3px var(--brand),var(--shadow)}
.day[aria-pressed="true"] .wd{color:var(--ink);font-weight:800}
.pill{display:inline-block;font-size:13px;font-weight:800;border-radius:8px;padding:0 8px;font-variant-numeric:tabular-nums}
.s-good{background:var(--good);color:#fff}.s-ok{background:var(--ok);color:#0A3F36}.s-mid{background:var(--mid);color:#5A3A00}.s-bad{background:var(--bad);color:#6B1D0E}
.card{margin:16px 20px 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(11,42,63,.05)}
.sum{display:flex;gap:16px;align-items:center}
.big{flex:0 0 76px;height:76px;border-radius:38px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big b{font-size:30px;font-weight:800;line-height:1}.big span{font-size:12px;font-weight:600}
h2{font-size:17px;font-weight:800;margin:0;text-wrap:balance}
.sec{margin:24px 20px 0;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted);font-size:13px}
.tbl{padding:6px 0}
.row{display:grid;grid-template-columns:48px 1fr 60px 56px;align-items:center;gap:10px;padding:7px 18px}
.row.h{font-size:12px;font-weight:700;color:var(--muted);padding-bottom:4px}
.row>span{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
/* جدول الساعات: لون الرياح بيبدأ من ناحية الوقت ويفتح لحد الأبيض. تحت كل صف شريط بطول سرعة الرياح، والجزء الفاتح منه هبّات */
.row.wx{position:relative;padding:9px 18px 13px;border-top:1px solid var(--line);background:linear-gradient(to left,var(--wc),var(--card) 48%)}
.row.wx .tm{justify-self:start;background:#fff;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 1px 2px rgba(14,60,90,.14)}
.row.wx .wbar{position:absolute;inset-inline:0;bottom:0;height:5px}
.wind{display:flex;align-items:center;gap:8px;font-size:18px!important;font-weight:800!important;line-height:1.15}
.wind .u{font-size:12px;font-weight:600}
.wind small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.temp{border-radius:10px;padding:7px 0;text-align:center;font-size:15px!important;font-weight:800!important}
.trip{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(11,42,63,.05)}
.trip .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.trip strong{font-size:16px;font-weight:800}
.trip .bot{display:flex;justify-content:space-between;align-items:center;gap:12px}
.price{font-size:16px;font-weight:800}
.chip{display:inline-block;font-size:12px;font-weight:700;background:var(--soft);border-radius:8px;padding:2px 10px}
.btn{flex:0 0 auto;min-height:46px;padding:0 20px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-weight:800}
.btn[disabled]{background:#D3DBE1;color:#44566A;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--ink)}
.q{display:block;width:100%;text-align:right;min-height:52px;padding:12px 18px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-weight:700}
.ans{display:flex;flex-direction:column;gap:10px}
.ans p{margin:0}
.ybox{display:flex;flex-direction:column;gap:10px}.ylist{display:flex;flex-direction:column;gap:8px}
.ym{max-width:88%;padding:10px 14px;border-radius:16px;line-height:1.7;white-space:normal;overflow-wrap:anywhere}
.yu{align-self:flex-start;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.ya{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.yrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.yrel{display:flex;flex-wrap:wrap;gap:6px}.ybox .yrel .q.yq{border:1.5px solid var(--brand);color:var(--brand);background:transparent;box-shadow:none}.ylist .yrel{justify-content:flex-end}.yq{display:inline-block;width:auto;min-height:0;padding:8px 14px;font-size:14px;border-radius:999px}
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
input,select{min-height:46px;border:1px solid #9FB0BC;border-radius:12px;padding:0 12px;background:#fff;font-size:16px;width:100%}
.filter{display:flex;align-items:center;gap:10px}
.filter label{flex-direction:row;align-items:center;gap:10px;flex:1;white-space:nowrap}
/* فلترين جنب بعض (المدة والمنطقة): العنوان فوق والقايمة تحته عشان الاسم يبان كامل */
.filter.two2{align-items:flex-end}.filter.two2 label{flex-direction:column;align-items:stretch;gap:4px;min-width:0}.filter.two2 select{width:100%;min-width:0}
.err{color:#8C1D0A;font-size:13px;font-weight:700;min-height:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);border-radius:14px;padding:4px}
.seg button{min-height:44px;border:0;border-radius:11px;background:none;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 1px 2px rgba(11,42,63,.12)}
.ovl{position:fixed;inset:0;background:rgba(11,42,63,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.ovl[hidden]{display:none}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:22px 22px 0 0;padding:22px 20px 26px;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
.rowbtns{display:flex;gap:8px}.rowbtns .btn{flex:1}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.list .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chart{padding:16px 12px 14px}
.chart h2,.chart .muted{padding:0 6px}
.bars{display:flex;gap:2px;align-items:flex-end;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.bar{flex:0 0 36px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 6px;border:0;border-radius:10px;background:none}
.bar[aria-pressed="true"]{background:var(--soft)}
.bar .bt{height:128px;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;border-bottom:1px solid #9FB0BC}
.bar .best{font-size:10px;font-weight:800;line-height:1.1}
.bar .bn{font-size:12px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.bar .bf{display:block;width:calc(100% - 6px);max-width:26px;border-radius:4px 4px 0 0}
.bar .wd{font-size:10px;font-weight:600;color:var(--muted);line-height:1.3}
.bar b{font-size:14px;font-weight:800;line-height:1.1}
.bar .bf.pre{background:#fff;border:2px dashed var(--ink);border-bottom:0}
.bar .mo{font-size:10px;font-weight:700;line-height:1.2;min-height:12px;white-space:nowrap}
/* فوق كل عمود شكل القمر، والخط اللي تحته نوع الليلة (أصفر مقمرة، كحلي ضلمة). وتحت التاريخ: فساد ولا حمل */
.bar .mn{display:block;line-height:0;padding-bottom:3px;border-bottom:3px solid transparent;margin-bottom:2px}
.bar .mn.mlit{border-bottom-color:#E9B93A}.bar .mn.mdark{border-bottom-color:var(--brand)}
.bar .hf{font-size:10px;font-weight:800;line-height:1.5;border-radius:6px;padding:0 3px;white-space:nowrap}
.bar .hf.fas{background:#DDF3EC;color:#0B5A47}.bar .hf.hml{background:#DFECF8;color:#1B4B7A}
.bar.more{flex:0 0 70px;align-self:stretch;justify-content:center;border:1.5px dashed #9FB0BC;font-size:12px;font-weight:800;margin-inline-start:6px}
.big.pre{background:#fff;border:2px dashed var(--ink)}
.legend i.pre{border:2px dashed var(--ink)}
/* نقطة برتقالي فوق النسبة: نماذج الجو مختلفة على اليوم ده */
.bar .bn .ud{display:block;width:7px;height:7px;border-radius:50%;background:#E08A00;margin:0 auto 2px}
.legend i.udl{width:9px;height:9px;border-radius:50%;background:#E08A00;border-color:#E08A00;vertical-align:0}
.chip.warn{background:#FFF1D6;color:#7A4B00}.chip.okc{background:#DDF3EC;color:#0B5A47}
.legend i.farf{background:repeating-linear-gradient(135deg,#fff 0 3px,#A9BCC8 3px 6px)}
/* العمود الأبيض (يوم من غير جو): جواه كلمة "تيار" عشان يبان إن النسبة من التيار بس */
.bar .bf.pre{display:flex;align-items:center;justify-content:center}
.bar .bf .bw{font-size:9px;font-weight:800;color:var(--muted);line-height:1}
.chart .legend{padding:10px 6px 0}
.legend i.g1{background:var(--good);border-color:var(--good)}.legend i.g2{background:var(--ok);border-color:var(--ok)}.legend i.g3{background:var(--mid);border-color:var(--mid)}.legend i.g4{background:var(--bad);border-color:var(--bad)}
.rates{display:flex;gap:6px;flex-wrap:wrap}
.rate{display:inline-flex;align-items:center;gap:5px;min-height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.rate .muted{font-weight:600}
.stars{display:flex;gap:2px}
.st{width:46px;height:46px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:10px}
.st svg{fill:#fff;stroke:#44566A}.st.on svg{fill:#B26A00;stroke:#B26A00}
.tide svg{display:block;width:100%;height:auto;margin:10px 0 4px}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.trow b{font-weight:800}
.notif{display:flex;flex-direction:column;gap:8px}
.notif .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.btn.sm{min-height:44px;padding:0 14px;font-size:13px}
.mgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:10px 0 6px}
.mc{border:1.5px solid #9FB0BC;border-radius:7px;background:#fff;text-align:center;font-size:12px;font-weight:700;padding:5px 0;font-variant-numeric:tabular-nums}
.mc.in{background:var(--ok);border-color:var(--ok);color:#0A3F36}
.mc.pk{background:var(--good);border-color:var(--good);color:#fff}
.mc.now{outline:2.5px solid var(--accent);outline-offset:1px}
.legend i.in{background:var(--ok);border-color:var(--ok)}.legend i.pk{background:var(--good);border-color:var(--good)}.legend i.nw{border:2.5px solid var(--accent)}
.shot{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:8px;display:block}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.tile b{display:block;font-size:22px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);font-weight:600}
.seats{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 6px}
.seat{width:18px;height:18px;border-radius:5px;border:1.5px solid #9FB0BC;background:#fff}
.seat.on{background:var(--brand);border-color:var(--brand)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 6px}
.cd{border-radius:10px;border:1.5px solid #9FB0BC;background:#fff;padding:5px 0;text-align:center;line-height:1.2}
.cd b{display:block;font-size:15px;font-weight:800}
.cd small{font-size:10px;font-weight:600}
.cd.trip{background:var(--mid);border-color:var(--mid);color:#5A3A00}
.cd.full{background:var(--good);border-color:var(--good);color:#fff}
/* جدول الشهر في لوحة المنظم وصاحب المركب: كل مركب بلون، واسمها مكتوب على أيام رحلتها */
.mcalh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mcalh strong{font-size:17px}
.mcalh button{min-width:48px;font-size:22px;font-weight:800;line-height:1;padding:0;font-family:system-ui,sans-serif}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mcal .wd{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:2px}
.md{min-height:62px;min-width:0;border-radius:10px;border:1.5px solid #D5DEE6;background:#fff;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit;color:inherit;line-height:1.25}
.md b{font-size:14px;font-weight:800}
.md small{font-size:9.5px;font-weight:700;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;text-align:center;line-height:1.2;overflow-wrap:anywhere}
.md.gone{color:#9FB0BC;border-color:#E6ECF1}
.md.on{background:var(--c);border-color:var(--cb);color:#0E2A44}
.md.on.gone{opacity:.6}
.md.now{outline:2.5px solid var(--accent);outline-offset:1px}
.md.sel{box-shadow:0 0 0 3px var(--brand)}
.mdot{display:inline-block;width:14px;height:14px;border-radius:5px;border:1.5px solid;flex:none}
.md.blk{background:repeating-linear-gradient(135deg,var(--c) 0 5px,#fff 5px 10px)}
.mdot.blk{background:repeating-linear-gradient(135deg,var(--c) 0 3px,#fff 3px 6px)}
.mdot,.legend i.mdot{background:var(--c);border-color:var(--cb)}
.legend i.mdot.blk{background:repeating-linear-gradient(135deg,var(--c) 0 3px,#fff 3px 6px)}
button.md:not(.on){cursor:pointer}
.bcard{display:flex;gap:12px;align-items:center}
.bcov{width:84px;height:84px;border-radius:14px;object-fit:cover;flex:none;background:#DCEBEF}
.bcov.none{display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:6px}
.bstrip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.bstrip img{height:210px;max-width:88%;border-radius:14px;object-fit:cover;flex:none;scroll-snap-align:start;background:#DCEBEF}
.chip.vip{margin-inline-start:6px;background:#0E2A44;color:#F6D365;font-weight:800;letter-spacing:.5px}
.fts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
label.ft{display:inline-flex;flex-direction:row;align-items:center;gap:7px;width:auto;border:1.5px solid #D5DEE6;border-radius:999px;padding:8px 12px;background:#fff;font-weight:700;font-size:14px;min-height:42px}
label.ft input{width:18px;height:18px;min-height:0;margin:0;padding:0;flex:none}
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border:0;background:none;font:inherit;color:inherit;padding:0;min-height:44px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1.5px solid #9FB0BC;background:#fff;vertical-align:-2px;margin-inline-end:4px}
.legend i.trip{background:var(--mid);border-color:var(--mid)}.legend i.full{background:var(--good);border-color:var(--good)}
button.cd{font-family:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:62px}
/* لون الخانة: فساد أو حمل. الخط اللي تحت: نوع الليلة. الإطار الأخضر: أفضل الأيام */
.cd.fas{background:#DDF3EC;border-color:#9CD6C6}
.cd.hml{background:#DFECF8;border-color:#A9C8E6}
button.cd{padding:5px 0 9px}
.cd.mdark{box-shadow:inset 0 -5px 0 var(--brand)}
.cd.mlit{box-shadow:inset 0 -5px 0 #E9B93A}
.cd.best{border:2.5px solid var(--good)}
.cd[aria-pressed="true"]{outline:2.5px solid var(--accent);outline-offset:1px}
.cd .pc{font-size:10px;font-weight:800;border-radius:6px;padding:0 4px;line-height:1.6;font-variant-numeric:tabular-nums}
.cd .pc.pre{background:#fff;border:1.5px dashed var(--ink);line-height:1.4}
.legend i.fas{background:#DDF3EC;border-color:#9CD6C6}.legend i.hml{background:#DFECF8;border-color:#A9C8E6}.legend i.best{border:2.5px solid var(--good)}
.legend i.mdark{background:var(--brand);border-color:var(--brand);height:5px;vertical-align:2px}.legend i.mlit{background:#E9B93A;border-color:#E9B93A;height:5px;vertical-align:2px}
.brk{margin:0 20px;background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;padding:6px 18px 12px}
.card.sum.hasbrk{border-radius:18px 18px 0 0}
.bk{display:grid;grid-template-columns:78px 1fr 64px 78px;align-items:center;gap:8px;padding:5px 0;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.bk b{font-weight:800;white-space:nowrap}.bk .muted{font-size:12px;font-weight:600}
.bkb{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;display:block}

ul.list li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}

   كحلي وتركواز، دايرة للنسبة، وشريط تبويبات كحلي. القواعد دي بتعدّل على اللي فوق. ===== */
body{background:#D9EBF0}
#app{background:linear-gradient(180deg,#DFF2F5 0,var(--ground) 300px)}
header{background:none;color:var(--ink);padding:14px 18px 8px;justify-content:flex-start;gap:12px}

header h1 .wm{font-size:25px;padding-bottom:5px}header h1 .wm2{color:#0E9AA7}
header #hArea{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.hd{display:flex;flex-direction:column;gap:1px;min-width:0}
main{scroll-behavior:smooth;padding-bottom:28px;scrollbar-width:thin;scrollbar-color:#C5DCE3 transparent}
.bars,.strip{scrollbar-width:thin;scrollbar-color:#C5DCE3 transparent;padding-bottom:6px}
.card,.trip,ul.list li,.q,.tile{border:0;box-shadow:var(--shadow)}
.card{border-radius:24px;margin:16px 16px 0;padding:20px}
.trip{border-radius:22px;padding:18px}

.sec{margin:26px 16px 0}
.strip{padding-inline:16px}
.brk{margin:0 16px;border:0;border-top:1px solid var(--line);border-radius:0 0 24px 24px;padding:8px 20px 14px;box-shadow:0 12px 22px rgba(14,60,90,.07)}
.card.sum.hasbrk{border-radius:24px 24px 0 0}
.tbl{padding:8px 0}
/* دايرة النسبة */
.big{flex:0 0 98px;width:98px;height:98px;border-radius:50%;color:var(--ink);--ring:var(--teal);
  background:radial-gradient(closest-side,#fff 79%,transparent 80%),conic-gradient(var(--ring) calc(var(--p,0)*1%),#DCEBEF 0)}
.big.s-good{--ring:#10314F}.big.s-ok{--ring:var(--teal)}.big.s-mid{--ring:#E9B93A}.big.s-bad{--ring:#E07A5F}
.big b{font-size:26px}.big span{font-size:11px;color:var(--muted)}
.big.pre{background:#fff;border:2px dashed #7F97A8}
/* الأعمدة */
.bar{border-radius:14px;transition:background .2s}
.bar[aria-pressed="true"]{background:#D9EEF2}
.bar .bt{border-bottom:0}
.bar .bf{border-radius:8px;max-width:22px;transition:height .45s cubic-bezier(.2,.8,.2,1)}
.bar .bf.pre{border:2px dashed #7F97A8;border-radius:8px}
.bar .bf.wn{box-shadow:inset 0 0 0 1.5px rgba(14,42,68,.22)}
.bar.more{border-color:#9AD3D9;color:#0B6F7A;border-radius:14px}
.pill{border-radius:999px;padding:1px 10px}
.chip{background:#E1F2F4;color:#0B5560;border-radius:999px;padding:3px 12px}
.rate{border-radius:999px;border-color:var(--line)}
/* الزراير */
.btn{border-radius:16px;background:linear-gradient(180deg,#0E8996,#0A6E79);box-shadow:0 6px 14px rgba(11,124,136,.28);transition:transform .12s,box-shadow .2s}
.btn:active{transform:scale(.97);box-shadow:0 2px 6px rgba(11,124,136,.28)}
.btn[disabled]{background:#DCE6EA;color:#5B7080;box-shadow:none}
.btn.ghost{background:#fff;color:#0B6F7A;border:1.5px solid #9AD3D9;box-shadow:none}
input,select{border:1.5px solid #CFE0E6;border-radius:14px;background:#F8FCFD;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(34,184,196,.18);outline:0}
.seg{background:#DDEDF1;border-radius:16px}
.seg button{border-radius:13px;transition:background .2s,color .2s}
/* شريط التبويبات */
nav{background:#0E2A44;border-top:0;border-radius:24px 24px 0 0;padding:6px 6px 10px;box-shadow:0 -8px 22px rgba(14,42,68,.2)}
nav button{color:#A9C4D6;border-radius:16px;transition:background .2s,color .2s}
nav button[aria-current="page"]{color:#fff;font-weight:800;background:rgba(34,184,196,.2);box-shadow:inset 0 3px 0 var(--teal)}
/* كارت إشعار الصبح: كحلي */
.card.notif{background:linear-gradient(135deg,#0E2A44,#14506C);color:#fff}
.notif .muted{color:#C9DDE8}
.notif .chip{background:rgba(255,255,255,.16);color:#fff}
.notif .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.notif .rate{background:rgba(255,255,255,.14);color:#fff;border:0}
/* النوافذ */
.ovl{backdrop-filter:blur(3px);animation:fade .2s ease both}
.sheet{border-radius:28px 28px 0 0;animation:up .28s cubic-bezier(.2,.8,.2,1) both}
/* دخول الصفحة عند تغيير التبويب بس */
#main.enter>*{animation:rise .34s ease both}
#main.enter>*:nth-child(2){animation-delay:.04s}#main.enter>*:nth-child(3){animation-delay:.08s}#main.enter>*:nth-child(n+4){animation-delay:.12s}
.rate.wa{color:#136B3A;border-color:#BFE8CF;background:#F2FBF5}
.trip.hl{box-shadow:0 0 0 3px var(--teal),var(--shadow)}
/* ===== الخريطة البحرية ===== */
nav{grid-template-columns:repeat(6,1fr)}
nav button{font-size:11.5px}
main[hidden]{display:none}
#mapWrap{flex:1;min-height:0;position:relative;z-index:0;margin:6px 12px 12px;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);background:#CFE6EE}

#map{position:absolute;inset:0;font-family:var(--font);background:#CFE6EE}
.mtools{position:absolute;top:10px;right:10px;z-index:1000;display:flex;flex-direction:column;gap:8px}
.mbtn{width:46px;height:46px;border-radius:14px;border:0;background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(14,42,68,.25);display:flex;align-items:center;justify-content:center}
.mbtn[aria-pressed="true"]{background:var(--brand);color:#fff}
.mbar{position:absolute;left:10px;right:10px;bottom:24px;z-index:1000;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 6px 18px rgba(14,42,68,.28);display:flex;flex-direction:column;gap:8px}
.mbar .dep{font-size:14px;font-weight:600}.mbar .dep b{font-weight:800;font-size:16px}

.mk{display:block;width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#E0553B;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.mk.pin{background:var(--brand)}
.ak{display:inline-block;transform:translate(-50%,-50%);white-space:nowrap;background:rgba(14,42,68,.88);color:#fff;font:700 12px var(--font);border-radius:999px;padding:2px 10px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.ak.on{background:var(--accent)}
.cl{display:inline-block;transform:translate(-50%,-50%);white-space:nowrap;font:700 11px var(--font);color:#134B70;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff}
.cl.s,.pl.s{color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 0 4px #000}
.pl{display:inline-flex;align-items:center;gap:3px;direction:ltr;transform:translate(-50%,-50%);white-space:nowrap;font:700 11px var(--font);color:#0E2A44;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff;cursor:pointer}
.pl i{font-style:normal}.pl .pr{color:#C0392B;font-size:15px;font-weight:800;line-height:1}.pl .pw{color:#7A1F8A;font-size:13px;font-weight:800;line-height:1}
.pl .ps{width:8px;height:8px;border-radius:50%;background:#E0553B;border:1.5px solid #fff;box-shadow:0 0 2px rgba(0,0,0,.5)}

.pl.t-fish{background:#0B7C88;color:#fff;text-shadow:none;border-radius:999px;padding:1px 9px;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pl.t-reef{color:#0B5D45}.pl.t-isl,.pl.t-cape{font-weight:600;font-style:italic;cursor:default}
.rn{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#E0553B;color:#fff;font:800 13px var(--font);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.rn.a{background:#136B3A}
.ck{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #0B7C88;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.mbar input{min-height:42px;font-size:15px}.mbar .err{min-height:0}
#lGeo .rate{min-height:34px;margin-inline-start:4px}
.mx{position:absolute;left:50%;top:50%;z-index:900;pointer-events:none}
.mx i{position:absolute;left:-13px;top:-13px;width:26px;height:26px;background:linear-gradient(#0E2A44,#0E2A44) center/2px 100% no-repeat,linear-gradient(#0E2A44,#0E2A44) center/100% 2px no-repeat;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff)}
.mx span{position:absolute;left:16px;top:-34px;white-space:nowrap;background:#0E2A44;color:#fff;font:800 14px var(--font);border-radius:10px;padding:2px 10px;box-shadow:0 2px 8px rgba(0,0,0,.4);font-variant-numeric:tabular-nums}
.mx span:empty{display:none}
.medot{position:relative;transform-origin:50% 50%}
.medot i{display:none;position:absolute;left:50%;top:-15px;margin-left:-6px;border:6px solid transparent;border-top:0;border-bottom:11px solid #1E88E5;filter:drop-shadow(0 0 1px #fff)}
.medot.h i{display:block}
.medot{display:block;width:18px;height:18px;border-radius:50%;background:#1E88E5;border:3px solid #fff;box-shadow:0 0 0 6px rgba(30,136,229,.25)}
.leaflet-container .leaflet-control-attribution{font-size:10px}
/* ===== لوحة الإدارة ===== */
.mgh{display:flex;align-items:center;gap:12px;padding:16px}
.av.md{flex-basis:56px;width:56px;height:56px;font-size:22px}
.tiles.t2{grid-template-columns:1fr 1fr}
.seg.s3{grid-template-columns:repeat(3,1fr)}.seg.s3 button{font-size:13px;padding:0 4px}
.rowbtns.wrap{flex-wrap:wrap;margin-top:10px}.rowbtns.wrap .btn{flex:1 1 auto;min-height:40px;padding:0 12px}

.rowbtns.wrap .rate{min-height:40px}
input[type=search]{-webkit-appearance:none;appearance:none}
.plist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.plist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}

.pbtn{display:flex;gap:6px;flex:0 0 auto}.pbtn .rate{min-height:40px;padding:0 10px}
.steps{counter-reset:st;list-style:none;margin:14px 0;padding:0;display:flex;flex-direction:column;gap:12px}

.steps li::before{counter-increment:st;content:counter(st);flex:0 0 30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:48px;border:1.5px solid #D5DEE6;border-radius:14px;background:#fff;color:#0E2A44;font:inherit;font-weight:700;font-size:15px}

.orline{display:flex;align-items:center;gap:10px;color:var(--muted,#6B7C8C);font-size:13px}

.lnk{align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;padding:0;min-height:36px}

#hAcct{margin-inline-start:auto;flex:0 1 auto;min-width:0;display:flex}
.hacct{display:flex;align-items:center;gap:8px;min-width:0;min-height:44px;border:0;border-radius:999px;background:#fff;color:var(--ink);padding:4px;padding-inline-end:14px;box-shadow:var(--shadow);font-weight:800;font-size:13px}

/* ===== المجتمع ===== */
nav{grid-template-columns:repeat(6,1fr)}
nav button{font-size:11.5px}
textarea{font-family:inherit;font-size:16px;color:inherit;width:100%;min-height:76px;border:1.5px solid #CFE0E6;border-radius:14px;background:#F8FCFD;padding:10px 12px;resize:vertical;line-height:1.5;transition:border-color .2s,box-shadow .2s}

.pb{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(14,42,68,.82);box-shadow:0 2px 10px rgba(0,0,0,.4)}

<script>
const WD=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const WDS=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const GM=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const HM=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
const SLOTS=['2 ص','5 ص','8 ص','11 ص','2 م','5 م','8 م','11 م'];
/* FORECAST_DAYS: أيام توقعات الجو. Open-Meteo بيدي 16 يوم بس اليوم الـ16 دايمًا ناقص ساعات، فالكامل 15.
   NEAR_DAYS: بعدها التوقع بعيد ودقته أقل (والموج والمد الحقيقيين بيغطوا لحد هنا بس) */
const FORECAST_DAYS=15,NEAR_DAYS=10;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const today=new Date();today.setHours(12,0,0,0);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fromIso=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const gDate=d=>WD[d.getDay()]+' '+d.getDate()+' '+GM[d.getMonth()];
const dWord=n=>n===1?'يوم واحد':n===2?'يومين':n<=10?n+' أيام':n+' يوم';

/* ---------- Hijri ---------- */
let hFmt=null;
try{const f=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric'});
  if(f.resolvedOptions().calendar.indexOf('islamic')===0)hFmt=f;}catch(e){}
function hijri(d){
  if(hFmt){try{const p={};hFmt.formatToParts(d).forEach(x=>p[x.type]=x.value);
    const day=parseInt(p.day,10),m=parseInt(p.month,10),y=parseInt(p.year,10);
    if(day>0&&m>0&&m<13)return{day,month:m-1,year:y};}catch(e){}}
  const anchor=new Date(2026,10,11,12);const n=Math.round((d-anchor)/864e5);const L=29.5306;
  const mi=Math.floor(n/L);const day=Math.floor(n-mi*L)+1;const tot=5+mi;
  return{day,month:((tot%12)+12)%12,year:1448+Math.floor(tot/12)};
}
const hText=d=>{const h=hijri(d);return h.day+' '+HM[h.month]+' '+h.year};
/* حمل: 12–18 و 27–4 ، فساد: 5–11 و 19–26 */
const isFasad=day=>(day>=5&&day<=11)||(day>=19&&day<=26);
const isTurn=day=>[3,4,11,12,17,18,26,27].includes(day);

/* ---------- Sample weather ---------- */
function rng(str){let h=1779033703;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}
const wxCache={};
function weather(d){
  const k=iso(d);if(wxCache[k])return wxCache[k];
  /* جو حقيقي لو متحمّل لليوم ده، وإلا أرقام تجريبية */
  const rl=realWx[k];
  if(rl&&rl.wind){const pick=a=>HRS.map(h=>a&&typeof a[h]==='number'?a[h]:null);
    const W=pick(rl.wind),T=pick(rl.temp),P=pick(rl.pres),D=pick(rl.dir),V=pick(rl.wave);
    if(![...W,...T,...P,...D].includes(null)){const wind=W.map(Math.round),rw=!V.includes(null),G=pick(rl.gust);
      /* الهبّات: أعلى سرعة لحظية. لو مش متاحة (جو محفوظ قديم) مبتظهرش */
      const gust=G.includes(null)?null:G.map((g,i)=>Math.max(Math.round(g),wind[i]));
      /* أقل وأعلى نموذج في كل ساعة، وأقل عدد نماذج في اليوم */
      const LO=pick(rl.wlo),HI=pick(rl.whi),NM=pick(rl.nm),multi=![...LO,...HI,...NM].includes(null);
      const lo=multi?LO.map(Math.round):null,hi=multi?HI.map(Math.round):null,nm=multi?Math.min.apply(null,NM):1;
      /* Open-Meteo بيدي اتجاه الرياح "جاية منين"، والسهم هنا "رايحة فين" */
      return wxCache[k]={wind,temp:T.map(Math.round),pres:P.map(Math.round),dir:D.map(x=>(Math.round(x)+180)%360),
        wave:rw?V.map(x=>Math.round(x*10)/10):wind.map(w=>Math.max(0.2,Math.round(w*0.045*10)/10)),gust,lo,hi,nm,real:true,realWave:rw}}}
  let wind,temp,pres,dir;
  if(k==='2026-11-13'){wind=[13,15,12,12,8,9,11,12];temp=[23,22,23,23,24,24,24,24];pres=[1018,1019,1020,1020,1018,1018,1019,1019];dir=[135,135,135,160,165,140,135,135];}
  else{const r=rng(k);const base=6+r()*13,tb=21+r()*4,pb=1014+r()*7,db=120+r()*50;const dt=[-1,-2,0,1,2,2,1,0];
    wind=[];temp=[];pres=[];dir=[];
    for(let i=0;i<8;i++){wind.push(Math.max(3,Math.round(base+((i<2||i>5)?1.5:-1.5)+(r()*4-2))));
      temp.push(Math.round(tb+dt[i]*0.7));pres.push(Math.round(pb+(r()*2-1)+(k.charCodeAt(9)%3===0?-i*0.6:0)));dir.push(Math.round(db+r()*20-10));}}
  const wave=wind.map(w=>Math.max(0.2,Math.round(w*0.045*10)/10));
  return wxCache[k]={wind,temp,pres,dir,wave};
}
/* اتفاق النماذج على رياح النهار (5 ص لـ5 م): lo وhi متوسط أقل وأعلى نموذج. لو الفرق SPREAD_BAD عقدة أو أكتر يبقى التوقعات مختلفة.
   بترجع null لو الجو مش حقيقي أو من نموذج واحد */
const SPREAD_BAD=4,SPREAD_OK=2.5; /* أقل من SPREAD_OK: توقع مؤكد. بينهم: من غير علامة */
function wxConf(w){if(!w.real||!w.lo||w.nm<2)return null;
  const idx=[1,2,3,4,5],av=a=>idx.reduce((s,i)=>s+a[i],0)/idx.length,lo=av(w.lo),hi=av(w.hi);
  return{lo:Math.round(lo),hi:Math.round(hi),hiAvg:hi,bad:hi-lo>=SPREAD_BAD,ok:hi-lo<SPREAD_OK,nm:w.nm}}
/* ---------- قوة التيار: فرق المد والجزر في اليوم ----------
   كل ما الفرق بين أعلى مد وأقل جزر في اليوم يكبر، التيار يبقى أحمى. الحمل والفساد تقريب لده بمستويين بس،
   والحقيقي بيتغير من يوم ليوم: في فساد مدّه عالي وفي حمل مدّه هادي.
   - الأيام اللي ليها مستوى بحر حقيقي (sea، حوالي 10 أيام): الفرق من البيانات نفسها.
   - أي يوم بعد كده: توقع من نمط آخر 3 شهور. النمط 5 موجات مد معروفة فتراتها بالساعة (M2, S2, N2, K1, O1)،
     بنظبط ارتفاع كل واحدة على مستوى البحر كل ساعة (least squares) في fitTide()، وبعدها tideAt() بتدي المستوى في أي وقت.
   اتجرّب على الغردقة (19 نوفمبر 2026): اتعلّم من 70 يوم وتوقع 29 يوم بعدهم بمتوسط خطأ 4.7 سم من 49. */
const TIDE_PER=[12.4206012,12,12.65834751,23.93447213,25.81933871],TIDE_FIT_DAYS=7,TIDE_FIT_MAXERR=0.10;
let tideFit=null;const rngCache={};
const clearRng=()=>{for(const k in rngCache)delete rngCache[k]};
const tideUrl=a=>'https://marine-api.open-meteo.com/v1/marine?latitude='+a.lat+'&longitude='+(a.slon||a.lon)+'&hourly=sea_level_height_msl&timezone=GMT&past_days=92&forecast_days=8';
/* th: الوقت بالساعات من 1970 */
function tideAt(f,th){const x=th-f.t0;let v=f.c[0];for(let k=0;k<TIDE_PER.length;k++){const w=2*Math.PI*x/TIDE_PER[k];v+=f.c[1+2*k]*Math.cos(w)+f.c[2+2*k]*Math.sin(w)}return v}
function fitTide(pts){
  const t0=pts[0].t,n=1+2*TIDE_PER.length,A=[];for(let i=0;i<n;i++)A.push(new Array(n+1).fill(0));
  for(const p of pts){const x=[1];for(const per of TIDE_PER){const w=2*Math.PI*(p.t-t0)/per;x.push(Math.cos(w),Math.sin(w))}
    for(let i=0;i<n;i++){for(let k=0;k<n;k++)A[i][k]+=x[i]*x[k];A[i][n]+=x[i]*p.h}}
  /* حل المعادلات بالحذف (Gauss-Jordan) */
  for(let i=0;i<n;i++){let m=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;
    const sw=A[i];A[i]=A[m];A[m]=sw;if(Math.abs(A[i][i])<1e-9)return null;
    for(let r=0;r<n;r++){if(r===i)continue;const f=A[r][i]/A[i][i];for(let k=i;k<=n;k++)A[r][k]-=f*A[i][k]}}
  return{t0,c:A.map((r,i)=>r[n]/r[i])};
}
/* بترجع 'cache' لو النمط محفوظ (بيتحط فورًا قبل أول رسم)، true لو اتحمّل واتحسب، false لو معرفناش */
async function loadTideFit(){
  const a=area,key='fishbook-tidefit-'+a.id;tideFit=null;clearRng();
  try{const c=JSON.parse(localStorage.getItem(key)||'null');if(c&&c.c&&c.area===a.id&&Date.now()-c.at<TIDE_FIT_DAYS*864e5){tideFit=c;return 'cache'}}catch(e){}
  try{const j=await fetch(tideUrl(a)).then(r=>r.ok?r.json():null);if(a!==area||!j||!j.hourly||!j.hourly.sea_level_height_msl)return false;
    const H=j.hourly.sea_level_height_msl,pts=[];j.hourly.time.forEach((s,i)=>{if(typeof H[i]==='number')pts.push({t:Date.parse(s+':00Z')/3600e3,h:H[i]})});
    if(pts.length<45*24)return false;
    const f=fitTide(pts);if(!f)return false;
    /* فحص: فرق المد المتوقع لازم يطلع قريب من الحقيقي على نفس الأيام، وإلا منستخدمش النمط */
    const days={};for(const p of pts){const d=Math.floor((p.t+2)/24),o=days[d]=days[d]||{n:0,a0:9,a1:-9,p0:9,p1:-9},v=tideAt(f,p.t);
      o.n++;if(p.h<o.a0)o.a0=p.h;if(p.h>o.a1)o.a1=p.h;if(v<o.p0)o.p0=v;if(v>o.p1)o.p1=v}

  if(/user_already_exists|already registered/i.test(c+m))return 'الإيميل ده متسجل قبل كده. اختار "دخول" وادخل بيه.';
  if(/email_not_confirmed|not confirmed/i.test(c+m))return 'لازم تأكد الإيميل الأول من الرسالة اللي وصلتك.';
  if(/same_password/i.test(c))return 'دي نفس كلمة السر القديمة. اكتب واحدة جديدة.';
  if(/over_email_send_rate_limit/i.test(c))return 'اتبعت إيميلات كتير في وقت قصير. جرّب بعد شوية.';
  if(/weak_password/i.test(c))return 'كلمة السر ضعيفة. اكتب 6 حروف أو أرقام على الأقل.';
  if(/email_address_invalid|validation_failed/i.test(c))return 'اكتب إيميل صحيح.';
  if(e.status===429)return 'محاولات كتير. جرّب بعد شوية.';
  if(c==='42501'||e.status===403)return 'حسابك مش مسموح له بالعملية دي.';

  if(!pushOk()){notifMsg='المتصفح ده مبيدعمش الإشعارات. على آيفون: ثبّت التطبيق على الشاشة الرئيسية الأول وافتحه منها.';render();return}

      const p=await Notification.requestPermission();
      if(p!=='granted'){notifMsg='الإشعارات مقفولة للموقع ده من إعدادات المتصفح. افتحها من الإعدادات وجرّب تاني.';render();return}
      const reg=await navigator.serviceWorker.ready,k=(await pushFn({action:'key'})).key;

/* ---------- ياسر: إجابات جاهزة من غير ذكاء اصطناعي ----------

/* تطبيع العربي: من غير تشكيل، أ إ آ = ا، ة = ه، ى = ي، والكلمة من غير "ال" في أولها */
const yNorm=s=>String(s||'').toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^؀-ۿa-z0-9%\s]/g,' ').replace(/[؟،؛]/g,' ').replace(/\s+/g,' ').trim();

let yIdx=null,yIdxN=-1;
function yIndex(){const all=yFaq();if(yIdx&&yIdxN===all.length)return yIdx;
  const docs=all.map(f=>({f,t:new Set(yTok([f.q].concat(f.alt||[]).join(' '))),kw:(f.kw||[]).map(k=>yTok(k).join(' ')).filter(Boolean)})),df={};
  docs.forEach(d=>d.t.forEach(w=>df[w]=(df[w]||0)+1));

  const ix=yIndex(),qt=[...new Set(yTok(q))],qn=' '+yTok(q).join(' ')+' ';if(!qt.length)return[];
  const tot=qt.reduce((s,w)=>s+ix.idf(w),0);
  return ix.docs.map(d=>{let m=0;qt.forEach(w=>{for(const x of d.t)if(ySame(w,x)){m+=ix.idf(w);break}});

async function vrStart(){

  let rec;try{rec=new MediaRecorder(stream,{audioBitsPerSecond:32000})}catch(e){try{rec=new MediaRecorder(stream)}catch(e2){stream.getTracks().forEach(t=>t.stop());drawVr('الموبايل ده مش بيسجّل صوت من المتصفح.');return}}

  rec.ondataavailable=e=>{if(e.data&&e.data.size)me_.chunks.push(e.data)};
  rec.onstop=()=>{clearInterval(me_.timer);stream.getTracks().forEach(t=>t.stop());if(vr!==me_)return;
    me_.blob=new Blob(me_.chunks,{type:(rec.mimeType||'audio/webm').split(';')[0]});me_.sec=Math.round((Date.now()-me_.t0)/1000);

    me_.url=URL.createObjectURL(me_.blob);me_.state='done';drawVr()};
  rec.start();me_.timer=setInterval(()=>{if(Date.now()-me_.t0>=VOICE_MAX*1000){try{rec.stop()}catch(e){}}else drawVr()},500);drawVr();
}

function ago(ts){

async function loadPosts(reset){

      pin=(await sbFetch('/rest/v1/posts_public?select=*&id=eq.'+pendingPost))[0]||null;
      if(pin)hlPost=pin.id;else comMsg='البوست اللي اتبعتلك اتمسح أو مش موجود. دي آخر البوستات.'}
    const last=posts.length?posts[posts.length-1].id:0;
    const rows=await sbFetch('/rest/v1/posts_public?select=*&order=id.desc&limit='+POSTS_PAGE+(comKind?'&kind=eq.'+comKind:'')+(comArea?'&area=eq.'+comArea:'')+(comUser?'&user_id=eq.'+comUser.id:'')+(last?'&id=lt.'+last:''));

    if(my!==comSeq)return;
    if(pin)posts.push(pin);
    posts=posts.concat(rows.filter(x=>!posts.some(y=>y.id===x.id)));comMore=rows.length===POSTS_PAGE;reps=rp;comState='ok';
  }catch(e){
    if(my!==comSeq)return;

/* تصغير الصورة لـ 1280 بكسل JPEG. إعادة الرسم بتشيل بيانات الصورة (ومنها مكان التصوير). لو فشل: null ومبنرفعش الأصل. */
async function shrinkPic(file){
  try{const bmp=await createImageBitmap(file),k=Math.min(1,1280/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(bmp.width*k));c.height=Math.max(1,Math.round(bmp.height*k));c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b&&b.type==='image/jpeg'?b:null),'image/jpeg',0.8))}catch(e){return null}
}

  if(!r.ok){let j=null;try{j=await r.json()}catch(e){}const er=new Error((j&&(j.message||j.error))||('HTTP '+r.status));er.status=r.status;throw er}
}

/* ----- صورة الحساب: بتتقص مربع 320 بكسل وبتترفع في فولدر العضو، ومسارها في profiles.avatar ----- */
async function squarePic(file,z){
  try{const bmp=await createImageBitmap(file),m=Math.min(bmp.width,bmp.height),c=document.createElement('canvas');c.width=c.height=z;
    c.getContext('2d').drawImage(bmp,(bmp.width-m)/2,(bmp.height-m)/2,m,m,0,0,z,z);
    return await new Promise(r=>c.toBlob(b=>r(b&&b.type==='image/jpeg'?b:null),'image/jpeg',0.85))}catch(e){return null}
}

const FISH_SPOTS=[{n:'أبو ملح',lat:27.5028,lon:33.7479}];
async function loadDetail(){
  if(det||detLoad)return;detLoad=true;
  try{const [c,r]=await Promise.all([getJson('data/contours.json'),getJson('data/reefs.json')]);
    const cv=L.canvas({padding:.3}),lv={};
    for(const k in c.levels){const lines=c.levels[k].map(a=>unpack(a,c.q));
      lv[k]={lines,ly:L.polyline(lines,{renderer:cv,interactive:false,color:'#1F5F8B',weight:CBOLD.includes(+k)?1.6:0.9,opacity:.8})}}
    det={lv,reef:L.polygon(r.reefs.map(x=>[unpack(x.p,r.q)]),{renderer:cv,interactive:false,color:'#1B7F5C',weight:1.3,fillColor:'#9AD9B0',fillOpacity:.5}),
      pts:FISH_SPOTS.map(f=>({t:"fish",n:f.n,lat:f.lat,lon:f.lon})).concat(r.reefs.filter(x=>x.n).map(x=>({t:'reef',n:x.n,lat:x.c[1]/r.q,lon:x.c[0]/r.q})).concat(r.pts.map(p=>({t:p.t,n:p.n||'',lat:p.y/r.q,lon:p.x/r.q}))))};
    lblLy=L.layerGroup().addTo(map);
    if(c.grid)loadDepthGrid(c.grid);
    map.attributionControl.addAttribution('خطوط: GMRT · شعاب وأسماء: © OpenStreetMap, GeoNames');
    map.on('moveend',mapDetail);mapDetail();
  }catch(e){detLoad=false}
}
/* بيتنادى مع كل تحريك: يظهر المستويات المناسبة للتكبير ويرسم الأرقام والأسماء اللي جوه الشاشة بس */
function mapDetail(){
  $('#mbDet').setAttribute('aria-pressed',detOn);
  if(!map||!det)return;const z=map.getZoom(),b=map.getBounds(),sat=mapBase==='sat';
  for(const k in det.lv){const ly=det.lv[k].ly,on=detOn&&(z>=10||(z>=8&&CMID.includes(+k))||CMAIN.includes(+k));
    if(on){ly.setStyle({color:sat?'#EAF7FF':'#1F5F8B'});if(!map.hasLayer(ly))ly.addTo(map)}else map.removeLayer(ly)}
  if(detOn&&z>=9){det.reef.setStyle(sat?{color:'#FFE66D',fillOpacity:0}:{color:'#1B7F5C',fillOpacity:.5});if(!map.hasLayer(det.reef))det.reef.addTo(map)}else map.removeLayer(det.reef);
  lblLy.clearLayers();if(!detOn||z<9)return;
  let n=0;
  if(z>=10)for(const k in det.lv){if(!map.hasLayer(det.lv[k].ly))continue;
    for(const ln of det.lv[k].lines){if(n>=45)break;const inb=[];for(let i=0;i<ln.length;i++)if(b.contains(ln[i]))inb.push(i);
      if(inb.length<3)continue;n++;
      L.marker(ln[inb[inb.length>>1]],{interactive:false,keyboard:false,icon:L.divIcon({className:'',html:`<span class="cl${sat?' s':''}">${k}</span>`,iconSize:[0,0]})}).addTo(lblLy)}}
  let m=0;
  for(const p of det.pts){if(m>=70)break;if(z<(p.t==='fish'?9:p.n?11:12)||!b.contains([p.lat,p.lon]))continue;m++;
    const sym=p.t==='rock'?'<i class="pr">+</i>':p.t==='wreck'?'<i class="pw">✕</i>':p.t==='site'?'<i class="ps"></i>':p.t==='anch'?'<i class="pa">⚓</i>':'';
    L.marker([p.lat,p.lon],{keyboard:false,interactive:p.t!=='isl'&&p.t!=='cape',icon:L.divIcon({className:'',html:`<span class="pl t-${p.t}${sat?' s':''}">${sym}${p.n?esc(p.n):''}</span>`,iconSize:[0,0]})})
      .on('click',()=>{mapSel={t:'pin',lat:p.lat,lon:p.lon,title:POI[p.t]+(p.n?': '+p.n:''),name:p.n};mapPin(mapSel);mapBar();fetchDepth(mapSel)}).addTo(lblLy)}
}

/* ---------- العمق اللحظي تحت علامة نص الخريطة ----------
   شبكة أعماق محلية (data/depth.png، خلية ~480 متر من GMRT) بتتقري من الذاكرة، فالرقم بيتغير مع كل تحريك من غير نت.
   بره منطقة الشبكة (باقي البحر الأحمر) الرقم بييجي من النت لما الخريطة تقف. */
let dg=null,crossT=0,crossSeq=0;
async function loadDepthGrid(meta){
  try{const img=new Image();img.src='data/depth.png';await img.decode();
    const c=document.createElement('canvas');c.width=meta.w;c.height=meta.h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);
    const px=x.getImageData(0,0,meta.w,meta.h).data,d=new Uint16Array(meta.w*meta.h);for(let i=0;i<d.length;i++)d[i]=px[i*4]<<8|px[i*4+1];
    dg={w:meta.w,h:meta.h,cell:meta.cell,x0:meta.x0,y1:meta.y1,d};mapCross();
  }catch(e){}
}
/* عمق بالمتر عند نقطة (استكمال بين 4 خلايا). 0 = بر. null = بره الشبكة */
function gridDepth(lat,lon){
  if(!dg)return null;const fx=(lon-dg.x0)/dg.cell,fy=(dg.y1-lat)/dg.cell;if(fx<0||fy<0||fx>dg.w-1||fy>dg.h-1)return null;
  const i=Math.floor(fx),j=Math.floor(fy),u=fx-i,v=fy-j,i2=Math.min(i+1,dg.w-1),j2=Math.min(j+1,dg.h-1),g=(a,b)=>dg.d[b*dg.w+a];
  return (g(i,j)*(1-u)+g(i2,j)*u)*(1-v)+(g(i,j2)*(1-u)+g(i2,j2)*u)*v;
}
const crossText=d=>d<0.5?'بر':Math.round(d)+' م';
function mapCross(){
  const el=$('#mapXd');if(!map||!el)return;const c=map.getCenter(),d=gridDepth(c.lat,c.lng);
  clearTimeout(crossT);
  if(d!==null){crossSeq++;el.textContent=crossText(d);return}
  /* بره الشبكة: نستنى الخريطة تقف وبعدين نسأل النت */
  el.textContent='…';const seq=++crossSeq;
  crossT=setTimeout(async()=>{
    try{const j=await getJson('https://www.gmrt.org/services/PointServer?longitude='+c.lng.toFixed(4)+'&latitude='+c.lat.toFixed(4)+'&format=json'),n=parseFloat(j&&j.elevation);
      if(seq===crossSeq)el.textContent=isFinite(n)?crossText(-n):'—'}catch(e){if(seq===crossSeq)el.textContent='—'}},600);
}
/* موقعي: أول دوسة بتشغّل المتابعة (الخريطة بتمشي معاك، فعلامة النص بتقرا العمق تحتك). سحب الخريطة أو دوسة تانية بيوقفوا المتابعة. */
let meWatch=null,meFollow=false;
const setLocBtn=()=>{const b=$('#mbLoc');if(b)b.setAttribute('aria-pressed',meFollow)};
function stopWatch(){if(meWatch!==null){navigator.geolocation.clearWatch(meWatch);meWatch=null}meFollow=false;setLocBtn();saveTrack();if(wake){wake.release().catch(()=>{});wake=null}}
/* أثر الحركة: خط أزرق ورا النقطة الزرقا. بيتسجل طول ما التتبع شغال (حتى لو فتحت تبويب تاني)، وبيتحفظ على الجهاز لمدة يوم.
   نقطة جديدة كل 15 متر على الأقل، والقراءات الضعيفة (دقة أسوأ من 80 متر) بتترمي عشان الخط ميتنططش. */
let track=[],trackLy=null,meHead=null,meSpd=null,wake=null;
try{const s=JSON.parse(localStorage.getItem('fishbook-track')||'null');if(s&&Array.isArray(s.p)&&Date.now()-s.at<24*3600e3)track=s.p.filter(p=>Array.isArray(p)&&typeof p[0]==='number'&&typeof p[1]==='number')}catch(e){}
function saveTrack(){try{localStorage.setItem('fishbook-track',JSON.stringify({at:Date.now(),p:track}))}catch(e){}}
function drawTrack(){if(!map)return;if(!trackLy)trackLy=L.polyline([],{color:'#1E88E5',weight:3.5,opacity:.9,interactive:false}).addTo(map);trackLy.setLatLngs(track)}
function trackAdd(c){
  if(typeof c.speed==='number'&&c.speed>=0)meSpd=c.speed*1.94384;
  if(typeof c.heading==='number'&&!isNaN(c.heading)&&c.speed>0.5)meHead=Math.round(c.heading);
  if(c.accuracy>80||!can('track'))return;
  const p=[Math.round(c.latitude*1e5)/1e5,Math.round(c.longitude*1e5)/1e5],l=track[track.length-1];
  if(l){const d=distBrg({lat:l[0],lon:l[1]},{lat:p[0],lon:p[1]});if(d.nm*1852<15)return;if(!(c.speed>0.5&&typeof c.heading==='number'&&!isNaN(c.heading)))meHead=d.br}
  track.push(p);if(track.length>4000)track.splice(0,track.length-4000);
  if(trackLy)trackLy.addLatLng(p);if(track.length%5===0)saveTrack();
}
const ME_ICON=()=>L.divIcon({className:'',html:'<span class="medot"><i></i></span>',iconSize:[18,18],iconAnchor:[9,9]});
function meTurn(){const el=meMk&&meMk.getElement()&&meMk.getElement().querySelector('.medot');if(!el)return;el.classList.toggle('h',meHead!==null);if(meHead!==null)el.style.transform='rotate('+meHead+'deg)'}
function keepAwake(){try{if(navigator.wakeLock&&!wake)navigator.wakeLock.request('screen').then(w=>{wake=w;w.addEventListener('release',()=>{if(wake===w)wake=null})}).catch(()=>{})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&meWatch!==null)keepAwake()});
function mapLocate(){
  if(!navigator.geolocation){mapSel=null;mapNote='الجهاز ده مش بيدّي الموقع.';mapBar();return}
  if(meFollow){meFollow=false;setLocBtn();return}
  meFollow=true;setLocBtn();keepAwake();
  if(mePos&&map)map.setView([mePos.lat,mePos.lon],Math.max(map.getZoom(),12));
  if(meWatch!==null)return;
  if(!mePos){mapSel=null;mapNote='بنحدد موقعك...';mapBar()}
  meWatch=navigator.geolocation.watchPosition(p=>{
    const first=!mePos||mapNote==='بنحدد موقعك...';mePos={lat:p.coords.latitude,lon:p.coords.longitude};if(first)mapNote='';
    trackAdd(p.coords);
    if(map){if(meMk)meMk.setLatLng([mePos.lat,mePos.lon]);else meMk=L.marker([mePos.lat,mePos.lon],{icon:ME_ICON(),interactive:false,zIndexOffset:500}).addTo(map);
      meTurn();
      if(meFollow)map.setView([mePos.lat,mePos.lon],first?Math.max(map.getZoom(),12):map.getZoom(),{animate:!first})}
    if(!(document.activeElement&&document.activeElement.id==='rtNote'))mapBar()},
    e=>{stopWatch();mapNote=e.code===1?'محتاجين إذن الموقع عشان نوريك مكانك على الخريطة. اسمح بيه من إعدادات المتصفح.':'معرفناش نحدد موقعك دلوقتي. جرّب تاني وانت في مكان مفتوح.';mapBar()},
    {enableHighAccuracy:true,timeout:20000,maximumAge:5000});
}

  $('#sheet').innerHTML=`<h2>${whole?'حجز المركب كاملة: ':'حجز مكان في '}${esc(t.boat)}</h2><span class="muted">${tripRange(t)} · ${dWord(t.n)} · ${whole?t.full+' جنيه للمركب كاملة':t.price+' جنيه للفرد'}</span>

    <label for="bPhone">رقم الموبايل<input id="bPhone" type="tel" inputmode="tel" maxlength="15" autocomplete="tel" value="${esc((srvOn()&&me&&me.phone)||'')}"></label>

    srvRun(e.target,'#fErr',async()=>{
      await sbFetch('/auth/v1/recover?redirect_to='+encodeURIComponent(/^https:$/.test(location.protocol)?location.origin+location.pathname:APP_URL),{method:'POST',noAuth:true,body:{email}});
      authMode='in';authMsg='لو الإيميل ده عليه حساب، هيوصله لينك خلال دقايق. افتح الإيميل (وبص في الرسائل غير المرغوبة) واضغط اللينك.';
      if(sheetAuth)$('#sheet').innerHTML=authCard();else render()});
  }else if(e.target.id==='newPwForm'){
    const pw=$('#nPw').value;
    if(pw.length<6){$('#nErr').textContent='كلمة السر 6 حروف أو أرقام على الأقل.';return}
    if(pw!==$('#nPw2').value){$('#nErr').textContent='الكلمتين مش زي بعض.';return}
    srvRun(e.target,'#nErr',async()=>{
      await sbFetch('/auth/v1/user',{method:'PUT',body:{password:pw}});
      $('#sheet').innerHTML='<h2>كلمة السر اتغيرت</h2><span class="muted">إنت داخل بحسابك دلوقتي. المرة الجاية ادخل بكلمة السر الجديدة.</span><button class="btn" type="button" data-act="close">تمام</button>'});
  }else if(e.target.id==='authForm'){
    const email=$('#aEmail').value.trim(),pw=$('#aPw').value,name=$('#aName')?$('#aName').value.trim():'',phone=$('#aPhone')?$('#aPhone').value.trim().replace(/[\s-]/g,''):'';
    if(authMode==='up'&&name.length<2){$('#aErr').textContent='اكتب اسمك.';return}
    if(authMode==='up'&&!/^\+?\d{10,14}$/.test(phone)){$('#aErr').textContent='اكتب رقم موبايل صحيح، أرقام بس.';return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){$('#aErr').textContent='اكتب إيميل صحيح.';return}
    if(pw.length<6){$('#aErr').textContent='كلمة السر 6 حروف أو أرقام على الأقل.';return}
    srvRun(e.target,'#aErr',async()=>{
      await doAuth(email,pw,name,phone,$('#aRole')?$('#aRole').value:'');
      if(!uid()){if(sheetAuth)$('#sheet').innerHTML=authCard();else render();return}
      if(sheetAuth)closeSheet();render()});
  }else if(e.target.id==='cancelBk'){
    const id=Number(e.target.dataset.id);
    srvRun(e.target,'#cbErr',async()=>{await sbFetch('/rest/v1/rpc/cancel_booking',{method:'POST',body:{p_booking:id}});kick();closeSheet();await loadSrv()});
  }else if(e.target.id==='cancelTrip'){
    const id=Number(e.target.dataset.id);
    srvRun(e.target,'#ctErr',async()=>{await sbFetch('/rest/v1/trips?id=eq.'+id,{method:'PATCH',body:{status:'cancelled'}});kick();closeSheet();await loadSrv()});
  }else if(e.target.id==='editTrip'){
    const t=trips.find(x=>x.id===Number(e.target.dataset.id));if(!t)return;
    const bk=t.total-t.left,b=boats.find(x=>x.id===t.boatId),date=$('#eDate').value;
    const n=Number($('#eDays').value),seats=Number($('#eSeats').value),price=Number($('#ePrice').value),full=Number($('#eFull').value)||0;
    if(!(seats>=1)||seats!==Math.round(seats)){$('#eErr').textContent='اكتب عدد الأماكن رقم صحيح.';return}
    if(seats<bk){$('#eErr').textContent='مينفعش الأماكن تبقى أقل من المحجوز ('+bk+').';return}
    if(b&&seats>b.cap){$('#eErr').textContent='المركب دي تشيل '+b.cap+' فرد بس.';return}
    const body={seats_total:seats};
    if(!bk){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<iso(today)){$('#eErr').textContent='اختار تاريخ من النهارده أو بعده.';return}
      if(!(n>=1)||n!==Math.round(n)){$('#eErr').textContent='اكتب عدد الأيام رقم صحيح، يوم أو أكتر.';return}
      if(!(price>=0)||full<0){$('#eErr').textContent='اكتب السعر بالأرقام.';return}
      const ar=$('#eArea').value;if(!AREAS.some(a=>a.id===ar)){$('#eErr').textContent='اختار منطقة الرحلة.';return}
      Object.assign(body,{start_date:date,days:n,price_seat:Math.round(price),price_whole:Math.round(full),area:ar});
    }
    srvRun(e.target,'#eErr',async()=>{await sbFetch('/rest/v1/trips?id=eq.'+t.id,{method:'PATCH',body});closeSheet();await loadSrv()});
  }else if(e.target.id==='rateForm'){
    const k=e.target.dataset.k;
    if(starSel<1){$('#rErr').textContent='اختار عدد النجوم الأول.';return}
    (ratings[k]=ratings[k]||[]).push({s:starSel,text:$('#rText').value.trim(),name:$('#rName').value.trim()});
    render();openRate(k,true);
  }else if(e.target.id==='logForm'){
    const species=($('#lSp').value||$('#lOther').value.trim()),kg=Math.round(Number($('#lKg').value)*10)/10,date=$('#lDate').value,bait=$('#lBait').value.trim();
    const time=/^\d{2}:\d{2}$/.test($('#lTime').value)?$('#lTime').value:'',spot=$('#lSpot').value.trim(),trip=$('#lTrip')?$('#lTrip').value:'';
    if(species.length<2){$('#lErr').textContent='اكتب نوع السمك.';return}
    if(!(kg>0)){$('#lErr').textContent='اكتب الوزن بالكيلو، رقم أكبر من صفر.';return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>iso(today)){$('#lErr').textContent='اختار يوم الصيد، النهارده أو قبله.';return}
    const f=$('#lImg').files&&$('#lImg').files[0];
    const add=id=>{if(f&&f.type.indexOf('image/')===0){try{shots[id]=URL.createObjectURL(f)}catch(err){}}
      logs.push({id,date,time,species,kg,bait,spot,trip,lat:geo?geo.lat:null,lon:geo?geo.lon:null});logGeo=null;logGeoMsg='';saveLogs();render()};
    const geo=logGeo?{lat:Math.round(logGeo.lat*1e5)/1e5,lon:Math.round(logGeo.lon*1e5)/1e5}:null;
    if(logSrv){const bk=myBk().find(b=>b.boat+' · '+b.range===trip);
      srvRun(e.target,'#lErr',async()=>{
        const r=await postCatches({caught_on:date,caught_at:time||null,species,kg,bait,spot,trip_id:bk?bk.tripId:null,area:area.id,lat:geo?geo.lat:null,lon:geo?geo.lon:null},'return=representation');
        add(r[0].id)});return}
    add(Date.now());
  }else if(e.target.id==='tripRateForm'){
    const b=bookings.find(x=>x.id===Number(e.target.dataset.id));
    if(starSel<1){$('#trErr').textContent='اختار عدد النجوم الأول.';return}
    if(b&&srvOn()){const body=$('#trText').value.trim(),rows=[{booking_id:b.id,target:'boat',stars:starSel,body}];
      if(b.org)rows.push({booking_id:b.id,target:'publisher',stars:starSel,body});
      srvRun(e.target,'#trErr',async()=>{await sbFetch('/rest/v1/ratings',{method:'POST',body:rows});closeSheet();await loadSrv()});return}
    if(b){const r={s:starSel,text:$('#trText').value.trim(),name:b.name};(ratings['b:'+b.boat]=ratings['b:'+b.boat]||[]).push(r);
      if(b.org)(ratings['o:'+b.org]=ratings['o:'+b.org]||[]).push(r);b.rated=starSel}
    closeSheet();render();
  }else if(e.target.id==='boatForm'){submitBoat(e.target);
  }else if(e.target.id==='capForm'){
    const v=$('#capC').value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)&&v.replace(/\D/g,'').length<10){$('#capErr').textContent='اكتب رقم موبايل صحيح أو إيميل.';return}
    saveCaptain(Number(e.target.dataset.id),v,e.target.querySelector('button[type="submit"]'));
  }else if(e.target.id==='blockForm'){submitBlock(e.target);
  }else if(e.target.id==='addBoat'){
    const name=$('#bbName').value.trim(),cap=Number($('#bbCap').value);
    if(name.length<2){$('#bbErr').textContent='اكتب اسم المركب.';return}
    if(!(cap>=1&&cap<=60)){$('#bbErr').textContent='عدد الأفراد من 1 لـ 60.';return}
    if(srvOn()){srvRun(e.target,'#bbErr',async()=>{
      await sbFetch('/rest/v1/boats',{method:'POST',body:{name,capacity:Math.round(cap),area:area.id,owner_id:role==='owner'?uid():null}});await loadSrv()});return}
    boats.push({id:nextId++,name,cap:Math.round(cap)});render();
  }else if(e.target.id==='addTrip'){
    const b=boats.find(x=>x.id===Number($('#tBoat').value)),date=$('#tDate').value;
    const n=Number($('#tDays').value),seats=Number($('#tSeats').value),price=Number($('#tPrice').value),full=Number($('#tFull').value)||0;
    if(!b){$('#tErr').textContent='اختار المركب.';return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<iso(today)){$('#tErr').textContent='اختار تاريخ من النهارده أو بعده.';return}
    if(!(n>=1)||n!==Math.round(n)){$('#tErr').textContent='اكتب عدد الأيام رقم صحيح، يوم أو أكتر.';return}
    if(!(seats>=1)){$('#tErr').textContent='اكتب عدد الأماكن.';return}
    if(seats>b.cap){$('#tErr').textContent='المركب دي تشيل '+b.cap+' فرد بس.';return}
    if(!(price>=0)||full<0){$('#tErr').textContent='اكتب السعر بالأرقام.';return}
    const ar=$('#tArea')?$('#tArea').value:area.id;if(!AREAS.some(a=>a.id===ar)){$('#tErr').textContent='اختار منطقة الرحلة.';return}
    const done=()=>{dur='';tripArea='';mode='seat';sel=date;ensureH(date);reveal=true;go('trips')};
    if(srvOn()){srvRun(e.target,'#tErr',async()=>{
      await sbFetch('/rest/v1/trips',{method:'POST',body:{boat_id:b.id,start_date:date,days:n,seats_total:Math.round(seats),price_seat:Math.round(price),price_whole:Math.round(full),area:ar}});
      await loadSrv();done()});return}
    trips.push({id:nextId++,date,boat:b.name,n,total:Math.round(seats),left:Math.round(seats),price:Math.round(price),full:Math.round(full),area:ar,by:role,org:role==='org'?(($('#tOrg')&&$('#tOrg').value.trim())||'منظم تجريبي 1'):''});
    done();
  }
});
function fromHash(){let h=(location.hash||'').slice(1);if(h==='log'){h='manage';mtab='log'}if(['home','trips','map','community','ask','log','manage'].includes(h)&&h!==view){view=h;render()}}
window.addEventListener('hashchange',fromHash);
let h0=(location.hash||'').slice(1);if(h0==='log'){h0='manage';mtab='log'}if(['home','trips','map','community','ask','log','manage'].includes(h0))view=h0;
/* آخر جو متحمّل (لو أحدث من 6 ساعات) يظهر فورًا، وبعدين نحدّث من النت */
try{const c=JSON.parse(localStorage.getItem('fishbook-live')||'null');if(c&&c.area===area.id&&c.wj&&c.wj.hourly&&Date.now()-c.at<6*3600e3){applyLive(c.wj,c.mj);live='cache';liveAt=c.at}}catch(e){}
if(live!=='cache')useSnap();
$('#hArea').textContent=area.name+' · نسخة تجريبية';
const tideBoot=loadTideFit(); /* لو النمط محفوظ بيتحط قبل أول رسم */
render();
loadLive();
tideBoot.then(tideDraw);
/* تحديث الجو لوحده: كل ساعة والتطبيق مفتوح قدامك، وأول ما ترجعله من الخلفية لو عدّى ساعة على آخر تحديث.
   ولو اليوم اتغيّر والتطبيق لسه مفتوح، الصفحة بتتحمّل من جديد عشان "النهارده" يبقى صح. */
const LIVE_EVERY=3600e3;let liveBusy=false;
async function refreshLive(){
  if(document.visibilityState!=='visible'||liveBusy||live==='snap'||live==='loading')return;
  if(iso(new Date())!==iso(today)){if(!busyUI())location.reload();return}
  if(Date.now()-liveAt<LIVE_EVERY)return;
  liveBusy=true;try{await loadLive(true)}finally{liveBusy=false}
}
setInterval(refreshLive,5*60e3);
document.addEventListener('visibilitychange',refreshLive);
if(recov)startRecovery();else loadSrv();
loadSeasons();loadYasserFaq();
loadExtAuth();
// التثبيت والفتح من غير نت: بيشتغل بس لما الملف يتفتح من سيرفر (http/https)، مش من file://
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
